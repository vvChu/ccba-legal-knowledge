[pytest]
pythonpath = .
testpaths = tests
python_files = test_*.py
markers =
    unit: Deterministic formula solvers and engineering math units
    solver: Symbolic formula solvers for wind load, deflection, and fire safety
    integration: Document conversion, crawler, consolidator, and Spoke CI gates
    e2e: End-to-end full document and dataset integrity audits
    milestone1: Milestone 1 adversarial tests
    milestone2: Milestone 2 table reconstruction tests
filterwarnings =
    ignore::DeprecationWarning
    ignore::pytest.PytestUnknownMarkWarning
