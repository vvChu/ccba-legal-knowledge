name: CCBA Legal Knowledge Spoke CI Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # Gate 1: Security & Secrets Gate
  # =========================================================================
  security-secrets-gate:
    name: 🔒 Security & Secrets Gate (Maskara)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Maskara Scanner
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml
          pip install "git+https://github.com/vvChu/ccba-agent-platform.git#subdirectory=packages/ccba-maskara" || echo "ℹ️ Hub repo is private; using built-in Spoke secret scanner fallback"

      - name: Run Maskara Secret Scan
        run: |
          if command -v maskara >/dev/null 2>&1; then
            maskara scan --root .
          else
            python -c "
          import pathlib, re, sys
          root = pathlib.Path('.')
          patterns = [
              ('AWS Access Key', re.compile(r'AKIA[0-9A-Z]{16}')),
              ('GitHub Token', re.compile(r'gh[pousr]_[A-Za-z0-9_]{36,}')),
              ('Google API Key', re.compile(r'AIza[0-9A-Za-z\-_]{35}')),
              ('OpenAI API Key', re.compile(r'sk-[A-Za-z0-9]{20,}T3BlbkFJ[A-Za-z0-9]{20,}')),
              ('Private Key Header', re.compile(r'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----')),
          ]
          skip_dirs = {'.git', '.venv', '__pycache__', '.rag_cache', 'node_modules'}
          findings = []
          for p in root.rglob('*'):
              if not p.is_file() or any(part in skip_dirs for part in p.parts):
                  continue
              if p.suffix.lower() in {'.pdf', '.docx', '.png', '.jpg', '.pyc', '.zip'}:
                  continue
              try:
                  txt = p.read_text(encoding='utf-8', errors='ignore')
              except Exception:
                  continue
              for label, rx in patterns:
                  for m in rx.finditer(txt):
                      if 'MASKARA_REDACTED' not in txt[max(0, m.start()-30):m.end()+30]:
                          findings.append((str(p), label))
          if findings:
              for f_path, label in findings:
                  print(f'❌ Secret detected [{label}] in {f_path}', file=sys.stderr)
              sys.exit(1)
          print('✅ [Maskara Fallback] 0 secrets detected across repository.')
          "
          fi

  # =========================================================================
  # Gate 2: Spoke Cleanliness & Script Budget (ADR-0044)
  # =========================================================================
  spoke-cleanliness-gate:
    name: 🧹 Spoke Cleanliness & Budget (ADR-0044)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Check Script Budget & Machine State Paths
        run: |
          python scripts/_guardrails/check_spoke_cleanliness.py

      - name: Check Hub Import Depth
        run: |
          python scripts/_guardrails/check_hub_import_depth.py

  # =========================================================================
  # Gate 3: Skills Governance & Distribution (ADR-0057 / ADR-0066)
  # =========================================================================
  skills-governance-gate:
    name: ⚙️ Skills Governance & Scope (ADR-0066)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Validate SKILL.md Frontmatter & GPI Score
        run: |
          python -c "
          import sys, yaml
          skill_path = '.agents/skills/ccba-verify-legal-knowledge/SKILL.md'
          with open(skill_path, 'r', encoding='utf-8') as f:
              parts = f.read().split('---')
          if len(parts) < 3:
              sys.exit('❌ Invalid frontmatter in ' + skill_path)
          meta = yaml.safe_load(parts[1])
          assert meta.get('scope') == 'spoke', f'Scope must be spoke, got {meta.get(\"scope\")}'
          assert meta.get('bundle') == '_core', f'Bundle must be _core, got {meta.get(\"bundle\")}'
          gpi = meta.get('gpi', {})
          score = 2.5 * gpi.get('s', 0) + 2.0 * gpi.get('k', 0) + 2.0 * gpi.get('a', 0) - 1.5 * gpi.get('p', 0)
          assert score >= 12.0, f'GPI score {score:.1f} < 12.0'
          print(f'✓ ADR-0066 & ADR-0057 Validated: scope={meta.get(\"scope\")}, bundle={meta.get(\"bundle\")}, GPI={score:.1f} >= 12.0')
          "

  # =========================================================================
  # Gate 4: Pstack Verification Harness Gate
  # =========================================================================
  verification-harness-gate:
    name: 🚀 Pstack Verification Harness (Evidence)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml python-docx

      - name: Run Pstack Verification Harness (Smoke Mode)
        run: |
          python .agents/skills/ccba-verify-legal-knowledge/harness/verify_legal_harness.py --mode smoke --skip-pdf-vault

      - name: Upload Verification Evidence Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-verify-legal-knowledge
          path: .md/reports/evidence_verify_legal_knowledge.json
          if-no-files-found: ignore

  # =========================================================================
  # Gate 5: Master Legal Knowledge 15 CI Gates
  # =========================================================================
  master-legal-gates:
    name: 🏛️ Master Legal Knowledge 15 CI Gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml python-docx

      - name: Run Master 15 CI Gates Validation
        run: |
          python scripts/validate_legal_spoke.py --skip-pdf-vault

      - name: Lint Visual Parity & Footnotes (Gate 9)
        run: |
          python scripts/lint_visual_parity.py

  # =========================================================================
  # Master Aggregator Gate (Satisfies GitHub Branch Protection Ruleset)
  # =========================================================================
  legal-knowledge-audit:
    name: Deterministic Parity & Schema Audit
    needs:
      - security-secrets-gate
      - spoke-cleanliness-gate
      - skills-governance-gate
      - verification-harness-gate
      - master-legal-gates
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify All 5 Parallel Gates Passed
        run: |
          echo "=== CCBA CI Matrix Aggregation Status ==="
          echo "1. Security & Secrets Gate: ${{ needs.security-secrets-gate.result }}"
          echo "2. Spoke Cleanliness Gate:  ${{ needs.spoke-cleanliness-gate.result }}"
          echo "3. Skills Governance Gate:  ${{ needs.skills-governance-gate.result }}"
          echo "4. Verification Harness:    ${{ needs.verification-harness-gate.result }}"
          echo "5. Master Legal CI Gates:   ${{ needs.master-legal-gates.result }}"

          if [ "${{ needs.security-secrets-gate.result }}" != "success" ] || \
             [ "${{ needs.spoke-cleanliness-gate.result }}" != "success" ] || \
             [ "${{ needs.skills-governance-gate.result }}" != "success" ] || \
             [ "${{ needs.verification-harness-gate.result }}" != "success" ] || \
             [ "${{ needs.master-legal-gates.result }}" != "success" ]; then
            echo "❌ [FAILED] One or more parallel CI gates failed!"
            exit 1
          fi
          echo "✅ [SUCCESS] All 5 parallel CI gates completed successfully!"
