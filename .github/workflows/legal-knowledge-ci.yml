name: CCBA Legal Knowledge Spoke CI Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  legal-knowledge-audit:
    name: Deterministic Parity & Schema Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml python-docx

      - name: 1. Validate Legal Spoke Registry & Schema
        run: |
          python scripts/validate_legal_spoke.py

      - name: 2. Verify Knowledge Deterministic Parity & Zero Data Loss
        run: |
          python scripts/verify_knowledge_integrity.py

      - name: 3. Verify Cross-Links & Inlined Semantic Anchors
        run: |
          python scripts/verify_cross_links.py

      - name: 4. Deep Anomaly & Format Scan
        run: |
          python scripts/audit_entire_knowledge_bundle.py
