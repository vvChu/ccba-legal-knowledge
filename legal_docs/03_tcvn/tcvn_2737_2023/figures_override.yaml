# figures_override.yaml - Bundle-level figure metadata overrides for TCVN 2737:2023
C.1:
  description: Mặt cao độ công trình quy ước z0 (mốc chuẩn) trên địa hình nghiêng
    dốc
  parameters:
  - z0 (mốc chuẩn quy ước)
  - i (độ dốc mặt đất)
  - z (cao độ tính toán)
  sub_figures:
  - a) Mặt đất có độ dốc 0,3 < i < 2
  - b) Mặt đất có độ dốc i >= 2
  cases:
  - 'i <= 0.3: z tính từ mặt đất thực tế'
  - '0.3 < i < 2: z tính từ mặt cao độ công trình quy ước z0'
  - 'i >= 2: z tính từ đáy công trình hoặc vách đứng'
