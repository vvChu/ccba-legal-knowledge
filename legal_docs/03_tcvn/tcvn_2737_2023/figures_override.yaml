E.1:
  description: Kích thước tương đương cho các mặt bằng phức tạp (chữ U, X, Y đôi,
    Y đơn, L, Z)
  parameters:
  - b (chiều rộng tương đương)
  - d (chiều sâu tương đương)
  - e = min(b, 2h)
  sub_figures:
  - a) Mặt bằng công trình hình chữ U
  - b) Mặt bằng công trình hình chữ X
  - c) Mặt bằng công trình hình chữ Y đôi
  - d) Mặt bằng công trình hình chữ Y đơn (d = b / 1,8)
  - e) Mặt bằng công trình hình chữ L (d = (d1 + d2) / 2)
  - f) Mặt bằng công trình hình chữ Z (d = (d1 + d2) / 2)
