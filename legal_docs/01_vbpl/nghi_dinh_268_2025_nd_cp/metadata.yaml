title: Nghị định 268/2025/NĐ-CP quy định chi tiết và hướng dẫn một số điều của Luật
  Khoa học, công nghệ và đổi mới sáng tạo về đổi mới sáng tạo; khuyến khích hoạt động
  khoa học, công nghệ và đổi mới sáng tạo trong doanh nghiệp; công nhận trung tâm
  đổi mới sáng tạo, hỗ trợ khởi nghiệp sáng tạo; công nhận cá nhân, doanh nghiệp khởi
