    ><b>CỘNG HÒA XÃ HỘI\n  CHỦ NGHĨA VIỆT NAM<br>\n  Độc lập - Tự do - Hạnh phúc <br>\n\
    \  ---------------</b></p>\n  </td>\n </tr>\n <tr>\n  <td width=\"223\" valign=\"\
    top\" style=\"width:167.4pt;padding:0cm 5.4pt 0cm 5.4pt\">\n  <p align=\"center\"\
    \ style=\"margin-top:6.0pt;text-align:center\">Số: 10/2021/NĐ-CP</p>\n  </td>\n\
    \  <td width=\"367\" valign=\"top\" style=\"width:275.4pt;padding:0cm 5.4pt 0cm\
    \ 5.4pt\">\n  <p align=\"right\" style=\"margin-top:6.0pt;text-align:right\"><i>Hà\
    \ Nội, ngày 09\n  tháng 02 năm 2021</i></p>\n  </td>\n </tr>\n</tbody></table>\n\
    \n\n\n \n\nNGHỊ ĐỊNH\n\nVỀ\nQUẢN LÝ CHI PHÍ ĐẦU TƯ XÂY DỰNG\n\nCăn cứ Luật Tổ\
    \ chức\nChính phủ ngày 19 tháng 6 năm 2015; Luật sửa\nđổi, bổ sung một số điều\
    \ của Luật Tổ chức Chính phủ và Luật Tổ chức chính quyền\nđịa phương ngày 22 tháng\
    \ 11 năm 2019;\n\nCăn cứ Luật Xây dựng\nngày 18 tháng 6 năm 2014; Luật sửa đổi,\
    \ bổ sung một\nsố điều của Luật Xây dựng ngày 17 tháng 6 năm 2020;\n\nCăn cứ Luật\
    \ Đầu tư\nngày 17 tháng 6 năm 2020;\n\nCăn cứ Luật Đầu tư\ncông ngày 13 tháng\
    \ 6 năm 2019;\n\nCăn cứ Luật Đầu tư\ntheo phương thức đối tác công tư ngày 18\
    \ tháng 6 năm 2020;\n\nCăn cứ Luật Đấu thầu\nngày 26 tháng 11 năm 2013;\n\nTheo\
    \ đề nghị của Bộ trưởng Bộ Xây dựng;\n\nChính phủ ban hành Nghị định về quản lý\
    \ chi phí\nđầu tư xây dựng.\n\nChương I\n\nQUY ĐỊNH CHUNG\n\nĐiều 1. Phạm vi điều\
    \ chỉnh\n\n1. Nghị định này quy định về quản lý chi phí đầu tư\nxây dựng các dự\
    \ án sử dụng vốn đầu tư công, vốn nhà nước ngoài đầu tư công, dự án\nđầu tư theo\
    \ phương thức đối tác công tư (sau đây gọi tắt là dự án PPP), gồm: sơ\nbộ tổng\
    \ mức đầu tư xây dựng, tổng mức đầu tư xây dựng, dự toán xây dựng, giá\ngói thầu\
    \ xây dựng; định mức xây dựng, giá xây dựng công trình, chi phí quản lý\ndự án\
    \ và tư vấn đầu tư xây dựng; thanh toán và quyết toán hợp đồng xây dựng,\nthanh\
    \ toán và quyết toán vốn đầu tư xây dựng; quyền và trách nhiệm của người\nquyết\
    \ định đầu tư, quyền và nghĩa vụ của chủ đầu tư, nhà thầu thi công xây dựng,\n\
    nhà thầu tư vấn trong quản lý chi phí đầu tư xây dựng.\n\n2. Việc quản lý chi\
    \ phí đầu tư xây dựng các dự án sử\ndụng nguồn vốn hỗ trợ phát triển chính thức\
    \ (gọi tắt là ODA), vốn vay ưu đãi của\nnhà tài trợ nước ngoài thực hiện theo\
    \ quy định của điều ước quốc tế; thỏa thuận\nvề vốn ODA, vốn vay ưu đãi đã được\
    \ ký kết; quy định tại Nghị định này và pháp\nluật về quản lý sử dụng vốn ODA,\
    \ vốn vay ưu đãi của các nhà tài trợ nước ngoài.\n\nĐiều 2. Đối tượng áp dụng\n\
    \n1. Nghị định này áp dụng đối với cơ quan, tổ chức,\ncá nhân có liên quan đến\
    \ quản lý chi phí đầu tư xây dựng các dự án sử dụng vốn\nđầu tư công, vốn nhà\
    \ nước ngoài đầu tư công, dự án PPP.\n\n2. Các tổ chức, cá nhân tham khảo\ncác\
    \ quy định tại Nghị định này để quản lý chi phí đầu tư xây dựng đối với các dự\n\
    án ngoài quy định tại khoản 1 Điều này.\n\nĐiều 3. Nguyên tắc quản lý chi\nphí\
    \ đầu tư xây dựng\n\n1. Quản lý chi phí đầu tư xây dựng phải đảm bảo các\nnguyên\
    \ tắc quy định tại Điều 132 Luật Xây dựng và khoản 50 Điều 1 Luật sửa đổi, bổ\
    \ sung một số điều của Luật Xây dựng,\nphù hợp với từng nguồn vốn để đầu tư xây\
    \ dựng, hình thức đầu tư, phương thức thực\nhiện, kế hoạch thực hiện của dự án\
    \ và quy định của pháp luật liên quan.\n\n2. Quy định rõ và thực hiện đúng quyền\
    \ và trách nhiệm\ncủa cơ quan quản lý nhà nước, của người quyết định đầu tư, cơ\
    \ quan chuyên môn về\nxây dựng; quyền và nghĩa vụ của chủ đầu tư, các tổ chức,\
    \ cá nhân có liên quan đến\nquản lý chi phí đầu tư xây dựng, phù hợp với trình\
    \ tự thực hiện đầu tư xây dựng\ntheo quy định tại khoản 1 Điều 50 Luật Xây dựng.\n\
    \n3. Nhà nước ban hành, hướng dẫn, kiểm tra việc thực\nhiện các quy định pháp\
    \ luật về quản lý chi phí đầu tư xây dựng; quy định các\ncông cụ cần thiết để\
    \ chủ đầu tư và các chủ thể có liên quan áp dụng, tham khảo\ntrong công tác quản\
    \ lý chi phí đầu tư xây dựng, gồm: định mức xây dựng, giá xây\ndựng công trình,\
    \ suất vốn đầu tư xây dựng, chỉ số giá xây dựng; giá vật liệu\nxây dựng, giá ca\
    \ máy và thiết bị thi công, đơn giá nhân công xây dựng; thông\ntin, dữ liệu về\
    \ chi phí đầu tư xây dựng các dự án, công trình xây dựng; các\nphương pháp xác\
    \ định và quản lý chi phí đầu tư xây dựng, đo bóc khối lượng, kiểm\nsoát chi phí,\
    \ định mức xây dựng, giá xây dựng công trình, suất vốn đầu tư xây dựng,\nchỉ số\
    \ giá xây dựng.\n\n4. Các dự án, công trình xây dựng đặc thù áp dụng\ncác quy\
    \ định tại Nghị định quy định chi tiết một số nội dung về quản lý dự án đầu\n\
    tư xây dựng và các cơ chế đặc thù theo quy định của Chính phủ, quyết định của\n\
    Thủ tướng Chính phủ để xác định và quản lý chi phí đầu tư xây dựng.\n\n5. Các\
    \ dự án, công trình xây dựng phục vụ quốc\nphòng, an ninh, thẩm quyền, trình tự\
    \ thẩm định tổng mức đầu tư xây dựng trong\nBáo cáo nghiên cứu khả thi đầu tư\
    \ xây dựng, Báo cáo kinh tế-kỹ thuật đầu tư xây\ndựng, thẩm quyền, trình tự thẩm\
    \ định, phê duyệt dự toán xây dựng trong thiết kế\nxây dựng triển khai sau thiết\
    \ kế cơ sở thực hiện theo quy định của Bộ trưởng Bộ\nQuốc phòng, Bộ trưởng Bộ\
    \ Công an.\n\n6. Dự án, công trình xây dựng\nthuộc các Chương trình mục tiêu quốc\
    \ gia áp dụng nguyên tắc, phương pháp xác định\nchi phí đầu tư xây dựng quy định\
    \ tại Nghị định này và pháp luật có liên quan\nphù hợp với đặc thù về tính chất\
    \ và điều kiện thực hiện công trình thuộc Chương\ntrình.\n\n7. Các dự án, công\
    \ trình đầu tư xây dựng tại nước\nngoài thực hiện quản lý đầu tư xây dựng theo\
    \ các nguyên tắc quy định tại Nghị định\nquy định chi tiết một số nội dung về\
    \ quản lý dự án đầu tư xây dựng.\n\nChương II\n\nSƠ BỘ TỔNG MỨC ĐẦU TƯ\nXÂY DỰNG,\
    \ TỔNG MỨC ĐẦU TƯ XÂY DỰNG\n\nĐiều 4. Xác định, thẩm định,\nphê duyệt sơ bộ tổng\
    \ mức đầu tư xây dựng\n\n1. Sơ bộ tổng mức đầu tư xây dựng là ước tính chi\nphí\
    \ đầu tư xây dựng của dự án trong Báo cáo nghiên cứu tiền khả thi đầu tư xây\n\
    dựng. Nội dung sơ bộ tổng mức đầu tư, gồm: chi phí bồi thường, hỗ trợ và tái định\n\
    cư (nếu có); chi phí xây dựng; chi phí thiết bị; chi phí quản lý dự án; chi phí\n\
    tư vấn đầu tư xây dựng; chi phí khác; chi phí dự phòng.\n\n2. Sơ bộ tổng mức đầu\
    \ tư xây dựng\nđược ước tính trên cơ sở quy mô, công suất hoặc năng lực phục vụ\
    \ theo phương án\nthiết kế sơ bộ của dự án và suất vốn đầu tư xây dựng hoặc dữ\
    \ liệu chi phí của\ncác dự án tương tự về loại, cấp công trình, quy mô, công suất\
    \ hoặc năng lực phục\nvụ, tính chất dự án đã thực hiện, có sự phân tích, đánh\
    \ giá để điều chỉnh quy đổi\nvề mặt bằng giá thị trường phù hợp với địa điểm xây\
    \ dựng, bổ sung những chi phí\ncần thiết khác của dự án.\n\n3. Việc thẩm định,\
    \ phê duyệt sơ bộ tổng mức đầu tư\nxây dựng thực hiện đồng thời với việc thẩm\
    \ định, phê duyệt Báo cáo nghiên cứu\ntiền khả thi đầu tư xây dựng theo quy định\
    \ của pháp luật về đầu tư công, đầu tư\ntheo phương thức đối tác công tư, quản\
    \ lý, sử dụng vốn nhà nước vào sản xuất,\nkinh doanh tại doanh nghiệp và pháp\
    \ luật khác có liên quan.\n\nĐiều 5. Nội dung tổng mức đầu\ntư xây dựng\n\n1.\
    \ Tổng mức đầu tư xây dựng là toàn bộ chi phí đầu\ntư xây dựng của dự án được\
    \ xác định phù hợp với thiết kế cơ sở và các nội dung\nkhác của Báo cáo nghiên\
    \ cứu khả thi đầu tư xây dựng.\n\n2. Nội dung tổng mức đầu tư xây\ndựng, gồm:\
    \ chi phí bồi thường, hỗ trợ và tái định cư (nếu có); chi phí xây dựng;\nchi phí\
    \ thiết bị; chi phí quản lý dự án; chi phí tư vấn đầu tư xây dựng; chi\nphí khác;\
    \ chi phí dự phòng và được quy định cụ thể như sau:\n\na) Chi phí bồi thường,\
    \ hỗ trợ\nvà tái định cư gồm: chi phí bồi thường về đất, nhà, công trình trên\
    \ đất, các\ntài sản gắn liền với đất, trên mặt nước và chi phí bồi thường khác\
    \ theo quy định;\ncác khoản hỗ trợ khi nhà nước thu hồi đất; chi phí tái định\
    \ cư; chi phí tổ chức\nbồi thường, hỗ trợ và tái định cư; chi phí sử dụng đất,\
    \ thuê đất tính trong thời\ngian xây dựng (nếu có); chi phí di dời, hoàn trả cho\
    \ phần hạ tầng kỹ thuật đã\nđược đầu tư xây dựng phục vụ giải phóng mặt bằng (nếu\
    \ có) và các chi phí có\nliên quan khác;\n\nb) Chi phí xây dựng gồm: chi phí xây\
    \ dựng các công\ntrình, hạng mục công trình của dự án; công trình, hạng mục công\
    \ trình xây dựng\ntạm, phụ trợ phục vụ thi công; chi phí phá dỡ các công trình\
    \ xây dựng không thuộc\nphạm vi của công tác phá dỡ giải phóng mặt bằng đã được\
    \ xác định trong chi phí\nbồi thường, hỗ trợ và tái định cư;\n\nc) Chi phí thiết\
    \ bị gồm: chi phí mua sắm thiết bị\ncông trình và thiết bị công nghệ; chi phí\
    \ quản lý mua sắm thiết bị (nếu có);\nchi phí mua bản quyền phần mềm sử dụng cho\
    \ thiết bị công trình, thiết bị công\nnghệ (nếu có); chi phí đào tạo và chuyển\
    \ giao công nghệ (nếu có); chi phí gia\ncông, chế tạo thiết bị cần gia công, chế\
    \ tạo (nếu có); chi phí lắp đặt, thí\nnghiệm, hiệu chỉnh; chi phí chạy thử thiết\
    \ bị theo yêu cầu kỹ thuật (nếu có);\nchi phí vận chuyển; bảo hiểm; thuế và các\
    \ loại phí; chi phí liên quan khác;\n\nd) Chi phí quản lý dự án là\nchi phí cần\
    \ thiết để tổ chức quản lý việc thực hiện và thực hiện các công việc\nquản lý\
    \ dự án từ giai đoạn chuẩn bị dự án, thực hiện dự án đến kết thúc xây dựng\nđưa\
    \ công trình của dự án vào khai thác sử dụng và quyết toán vốn đầu tư xây dựng,\n\
    được quy định chi tiết tại Điều 30 Nghị định này;\n\nđ) Chi phí tư vấn đầu tư\
    \ xây dựng là chi phí cần\nthiết để thực hiện các công việc tư vấn đầu tư xây\
    \ dựng từ giai đoạn chuẩn bị dự\nán, thực hiện dự án đến kết thúc xây dựng đưa\
    \ công trình của dự án vào khai\nthác sử dụng và quyết toán vốn đầu tư xây dựng,\
    \ được quy định chi tiết tại Điều 31 Nghị định này;\n\ne) Chi phí khác gồm các\
    \ chi\nphí cần thiết để thực hiện dự án đầu tư xây dựng, gồm: chi phí rà phá bom\
    \ mìn,\nvật nổ; chi phí di chuyển máy, thiết bị thi công đặc chủng đến và ra khỏi\
    \ công\ntrường; chi phí đảm bảo an toàn giao thông phục vụ thi công; chi phí hoàn\
    \ trả hạ\ntầng kỹ thuật do bị ảnh hưởng khi thi công xây dựng; chi phí kho bãi\
    \ chứa vật\nliệu; chi phí xây dựng nhà bao che cho máy, nền móng máy, hệ thống\
    \ cấp điện,\nkhí nén, hệ thống cấp nước tại hiện trường, lắp đặt, tháo dỡ một\
    \ số loại máy;\nchi phí bảo hiểm công trình trong thời gian xây dựng; đăng kiểm\
    \ chất lượng quốc\ntế, quan trắc biến dạng công trình; kiểm toán, thẩm tra, phê\
    \ duyệt quyết toán vốn\nđầu tư; kiểm tra công tác nghiệm thu trong quá trình thi\
    \ công xây dựng và khi\nnghiệm thu hoàn thành hạng mục công trình, công trình\
    \ của cơ quan chuyên môn về\nxây dựng hoặc hội đồng do Thủ tướng Chính phủ thành\
    \ lập; nghiên cứu khoa học\ncông nghệ, áp dụng, sử dụng vật liệu mới liên quan\
    \ đến dự án; vốn lưu động ban\nđầu đối với dự án đầu tư xây dựng nhằm mục đích\
    \ kinh doanh, lãi vay trong thời\ngian xây dựng; chi phí cho quá trình chạy thử\
    \ không tải và có tải dây chuyền\ncông nghệ, sản xuất theo quy trình trước khi\
    \ bàn giao (trừ giá trị sản phẩm thu\nhồi được); chi phí thẩm định Báo cáo nghiên\
    \ cứu khả thi đầu tư xây dựng, Báo\ncáo kinh tế - kỹ thuật đầu tư xây dựng; các\
    \ khoản thuế tài nguyên, phí và lệ\nphí theo quy định và các chi phí cần thiết\
    \ khác để thực hiện dự án đầu tư xây dựng\nkhông thuộc quy định tại các điểm a,\
    \ b, c, d, đ Điều này;\n\ng) Chi phí dự phòng gồm chi\nphí dự phòng cho khối lượng,\
    \ công việc phát sinh và chi phí dự phòng cho yếu tố\ntrượt giá trong thời gian\
    \ thực hiện dự án.\n\n3. Dự án chỉ yêu cầu lập Báo cáo kinh tế-kỹ thuật đầu\n\
    tư xây dựng, tổng mức đầu tư xây dựng gồm dự toán xây dựng công trình theo quy\n\
    định tại Điều 11 Nghị định này, chi phí bồi thường, hỗ trợ\nvà tái định cư (nếu\
    \ có) và các chi phí liên quan tính chung cho dự án. Dự toán\nxây dựng công trình\
    \ được xác định theo quy định tại Điều 12 Nghị\nđịnh này.\n\nĐiều 6. Xác định\
    \ tổng mức đầu\ntư xây dựng\n\n1. Tổng mức đầu tư xây dựng được xác định theo\
    \ các\nphương pháp sau:\n\na) Phương pháp xác định từ khối lượng xây dựng tính\n\
    theo thiết kế cơ sở và các yêu cầu cần thiết khác của dự án;\n\nb) Phương pháp\
    \ xác định theo\nsuất vốn đầu tư xây dựng;\n\nc) Phương pháp xác định từ dữ liệu\
    \ về chi phí của\ncác dự án, công trình tương tự đã thực hiện;\n\nd) Kết hợp các\
    \ phương pháp quy định tại điểm a, b,\nc khoản này.\n\n2. Phương pháp quy định\
    \ tại điểm a khoản 1 Điều này\nlà phương pháp cơ bản để xác định tổng mức đầu\
    \ tư xây dựng đối với dự án, công\ntrình có thiết kế cơ sở đủ điều kiện để xác\
    \ định khối lượng các công tác, nhóm,\nloại công tác xây dựng, đơn vị kết cấu,\
    \ bộ phận công trình và giá xây dựng công\ntrình tương ứng.\n\n3. Xác định tổng\
    \ mức đầu tư xây dựng theo phương\npháp quy định tại điểm a khoản 1 Điều này như\
    \ sau:\n\na) Chi phí bồi thường, hỗ trợ\nvà tái định cư được xác định trên cơ\
    \ sở phương án bồi thường, hỗ trợ và tái định\ncư của dự án và các chế độ, chính\
    \ sách của Nhà nước có liên quan;\n\nb) Chi phí xây dựng được xác định trên cơ\
    \ sở khối\nlượng công việc, công tác xây dựng; nhóm, loại công tác xây dựng, đơn\
    \ vị kết cấu\nhoặc bộ phận công trình và giá xây dựng công trình tương ứng và\
    \ một số chi phí\ncó liên quan khác;\n\nc) Chi phí thiết bị được xác định trên\
    \ cơ sở khối\nlượng, số lượng, chủng loại thiết bị hoặc hệ thống thiết bị theo\
    \ phương án công\nnghệ, kỹ thuật, thiết bị được lựa chọn, giá mua thiết bị phù\
    \ hợp giá thị trường\nvà các chi phí khác có liên quan;\n\nd) Chi phí quản lý\
    \ dự án được xác định theo quy định\ntại Điều 30 Nghị định này;\n\nđ) Chi phí\
    \ tư vấn đầu tư xây dựng được xác định\ntheo quy định tại Điều 31 Nghị định này;\n\
    \ne) Chi phí khác được xác định bằng định mức tỷ lệ\nphần trăm (%) hoặc bằng phương\
    \ pháp lập dự toán. Chi phí rà phá bom mìn, vật nổ\nđược xác định theo quy định\
    \ của Bộ trưởng Bộ Quốc phòng;\n\ng) Chi phí dự phòng cho khối\nlượng, công việc\
    \ phát sinh được xác định bằng tỷ lệ phần trăm (%) trên tổng các\nkhoản mục chi\
    \ phí quy định tại điểm a, b, c, d, đ, e khoản này. Riêng tỷ lệ phần\ntrăm đối\
    \ với chi phí dự phòng cho yếu tố trượt giá được xác định trên cơ sở độ\ndài thời\
    \ gian thực hiện dự án, kế hoạch thực hiện dự án và chỉ số giá xây dựng\nphù hợp\
    \ với loại công trình xây dựng có tính đến các khả năng biến động giá\ntrong nước\
    \ và quốc tế.\n\n4. Xác định tổng mức đầu tư xây dựng theo phương\npháp quy định\
    \ tại điểm b khoản 1 Điều này như sau:\n\nTổng mức đầu tư xây dựng xác định trên\
    \ cơ sở khối\nlượng, diện tích, công suất hoặc năng lực phục vụ theo thiết kế\
    \ cơ sở và suất vốn\nđầu tư xây dựng tương ứng được công bố phù hợp với loại và\
    \ cấp công trình, có sự\nđánh giá, quy đổi, tính toán về thời điểm lập tổng mức\
    \ đầu tư xây dựng, địa điểm\nthực hiện dự án, bổ sung các chi phí cần thiết khác\
    \ của dự án chưa được tính\ntrong suất vốn đầu tư xây dựng phù hợp với điều kiện\
    \ cụ thể của dự án, công\ntrình.\n\n5. Xác định tổng mức đầu tư xây dựng theo\
    \ phương\npháp quy định tại điểm c khoản 1 Điều này như sau:\n\nTổng mức đầu tư\
    \ xây dựng được xác định trên cơ sở\nkhối lượng, diện tích, công suất hoặc năng\
    \ lực phục vụ theo thiết kế cơ sở và dữ\nliệu về chi phí của các dự án, công trình\
    \ tương tự đã thực hiện có cùng loại, cấp\ncông trình, quy mô, công suất hoặc\
    \ năng lực phục vụ. Các dữ liệu về chi phí sử\ndụng cần thực hiện quy đổi, tính\
    \ toán về thời điểm lập tổng mức đầu tư xây dựng,\nđịa điểm thực hiện dự án, bổ\
    \ sung các chi phí cần thiết khác phù hợp với điều\nkiện cụ thể của dự án, công\
    \ trình.\n\n6. Căn cứ mức độ chi tiết thiết kế cơ sở của dự án,\nsuất vốn đầu\
    \ tư xây dựng được công bố, dữ liệu về chi phí của các dự án, công\ntrình tương\
    \ tự đã thực hiện, kết hợp hai hoặc cả ba phương pháp quy định tại điểm\na, b,\
    \ c khoản 1 Điều này để xác định tổng mức đầu tư xây dựng.\n\nĐiều 7. Thẩm tra,\
    \ thẩm định tổng\nmức đầu tư xây dựng\n\n1. Thẩm định tổng mức đầu tư xây dựng\
    \ là một nội\ndung của thẩm định Báo cáo nghiên cứu khả thi đầu tư xây dựng, Báo\
    \ cáo kinh tế\n- kỹ thuật đầu tư xây dựng. Thẩm quyền thẩm định tổng mức đầu tư\
    \ xây dựng được\nthực hiện theo quy định của Luật Xây dựng\nvà Nghị định quy định\
    \ chi tiết một số nội dung về quản lý dự án đầu tư xây dựng.\n\n2. Nội dung chi\
    \ tiết thẩm định\ntổng mức đầu tư xây dựng của cơ quan chuyên môn về xây dựng\
    \ quy định tại điểm g khoản 2 Điều 58 Luật Xây dựng được\nsửa đổi, bổ sung tại\
    \ khoản 15 Điều 1 Luật sửa đổi, bổ sung một\nsố điều của Luật Xây dựng như sau:\n\
    \na) Sự đầy đủ, tính hợp lệ của hồ sơ trình thẩm định\ntổng mức đầu tư xây dựng;\
    \ các căn cứ pháp lý để xác định tổng mức đầu tư xây dựng;\n\nb) Sự phù hợp của\
    \ tổng mức đầu tư xây dựng với sơ bộ\ntổng mức đầu tư xây dựng đã được phê duyệt;\
    \ phương pháp xác định tổng mức đầu\ntư xây dựng;\n\nc) Sự phù hợp của nội dung\
    \ tổng mức đầu tư xây dựng\nquy định tại Điều 5 Nghị định này với các nội dung\
    \ và yêu cầu\ncủa dự án;\n\nd) Sự tuân thủ các quy định của pháp luật về áp dụng,\n\
    tham khảo hệ thống định mức xây dựng, giá xây dựng công trình, các công cụ cần\n\
    thiết khác do cơ quan nhà nước có thẩm quyền ban hành, công bố và việc vận dụng,\n\
    tham khảo dữ liệu về chi phí của các dự án, công trình tương tự để xác định tổng\n\
    mức đầu tư xây dựng.\n\n3. Nội dung chi tiết thẩm định tổng mức đầu tư xây\ndựng\
    \ của cơ quan hoặc tổ chức, cá nhân được người quyết định đầu tư giao chủ\ntrì\
    \ thẩm định quy định tại điểm a khoản 3 Điều 56 và điểm d khoản\n1 Điều 57 Luật\
    \ Xây dựng được sửa đổi, bổ sung tại khoản 13 và 14 Điều 1 Luật sửa\nđổi, bổ sung\
    \ một số điều của Luật Xây dựng như sau:\n\na) Sự đầy đủ, tính hợp lệ của hồ sơ\
    \ trình thẩm định\ntổng mức đầu tư xây dựng; kiểm tra kết quả thẩm tra tổng mức\
    \ đầu tư xây dựng của\ntổ chức tư vấn (nếu có);\n\nb) Kết quả hoàn thiện, bổ sung\
    \ hồ sơ trình thẩm định\ntổng mức đầu tư xây dựng theo các kiến nghị của cơ quan\
    \ chuyên môn về xây dựng\nquy định tại khoản 2 Điều này (nếu có) và các ý kiến\
    \ giải trình;\n\nc) Sự phù hợp, đầy đủ của việc xác định khối lượng\nhoặc quy\
    \ mô, công suất, năng lực phục vụ tính toán trong tổng mức đầu tư xây dựng\nso\
    \ với thiết kế cơ sở của dự án;\n\nd) Xác định giá trị tổng mức đầu tư xây dựng\
    \ đảm bảo\ntính đúng, tính đủ theo quy định, phù hợp với yêu cầu thiết kế, điều\
    \ kiện xây dựng,\nmặt bằng giá thị trường và kế hoạch thực hiện dự án;\n\nđ) Phân\
    \ tích nguyên nhân tăng, giảm và đánh giá việc\nbảo đảm hiệu quả đầu tư của dự\
    \ án theo giá trị tổng mức đầu tư xây dựng xác định\nsau thẩm định.\n\n4. Đối\
    \ với dự án sử dụng vốn nhà nước ngoài đầu tư\ncông không thuộc đối tượng quy\
    \ định tại điểm c khoản 1 Điều 58 của\nLuật Xây dựng được sửa đổi bổ sung tại\
    \ khoản 14 Điều 1 Luật sửa đổi, bổ sung một\nsố điều của Luật Xây dựng, người\
    \ quyết định đầu tư thẩm định các nội dung\nquy định tại khoản 2, 3 Điều này.\n\
    \n5. Đối với dự án chỉ yêu cầu lập Báo cáo kinh tế -\nkỹ thuật đầu tư xây dựng,\
    \ người quyết định đầu tư thẩm định các nội dung quy định\ntại khoản 3, 4 Điều\
    \ 13 Nghị định này.\n\n6. Việc thẩm tra phục vụ thẩm định tổng mức đầu tư\nxây\
    \ dựng thực hiện theo quy định về thẩm tra phục vụ thẩm định dự án tại Nghị định\n\
    quy định chi tiết một số nội dung về quản lý dự án đầu tư xây dựng.\n\n7. Chi\
    \ phí cho tổ chức, cá nhân tham gia thẩm định\nđược trích từ phí, chi phí thẩm\
    \ định Báo cáo nghiên cứu khả thi đầu tư xây dựng,\nBáo cáo kinh tế-kỹ thuật đầu\
    \ tư xây dựng.\n\n8. Bộ Xây dựng quy định chi phí\nthẩm định, thẩm tra Báo cáo\
    \ nghiên cứu khả thi đầu tư xây dựng, Báo cáo kinh tế\n- kỹ thuật đầu tư xây dựng.\
    \ Bộ Tài chính quy định phí thẩm định dự án đầu tư\nxây dựng.\n\nĐiều 8. Phê duyệt\
    \ tổng mức đầu\ntư xây dựng\n\n1. Phê duyệt tổng mức đầu tư xây dựng là một nội\n\
    dung của quyết định đầu tư xây dựng. Thẩm quyền quyết định đầu tư xây dựng theo\n\
    quy định tại Điều 60 Luật Xây dựng được sửa đổi, bổ sung tại\nkhoản 17 Điều 1\
    \ Luật sửa đổi, bổ sung một số điều của Luật Xây\ndựng.\n\n2. Tổng mức đầu tư\
    \ xây dựng được phê duyệt là chi\nphí tối đa để thực hiện dự án đầu tư xây dựng.\n\
    \nĐiều 9. Điều chỉnh tổng mức đầu\ntư xây dựng\n\n1. Tổng mức đầu tư xây dựng\
    \ đã phê duyệt được điều\nchỉnh theo quy định tại khoản 5 Điều 134 Luật Xây dựng\
    \ và điểm đ khoản 18 Điều 1 Luật sửa đổi, bổ sung một số điều của Luật\nXây dựng.\n\
    \n2. Tổng mức đầu tư xây dựng điều chỉnh gồm phần tổng\nmức đầu tư không điều\
    \ chỉnh và phần tổng mức đầu tư điều chỉnh. Các nội dung\nliên quan đến phần tổng\
    \ mức đầu tư xây dựng điều chỉnh phải được thẩm định theo\nquy định tại Điều 7\
    \ Nghị định này. Thẩm quyền thẩm định, phê\nduyệt tổng mức đầu tư xây dựng điều\
    \ chỉnh thực hiện theo quy định về thẩm quyền\nthẩm định, phê duyệt dự án điều\
    \ chỉnh tại Nghị định quy định chi tiết một số nội\ndung về quản lý dự án đầu\
    \ tư xây dựng.\n\nĐiều 10. Thẩm định, phê duyệt\nchi phí chuẩn bị dự án\n\n1.\
    \ Chi phí chuẩn bị dự án gồm\nchi phí để thực hiện các công việc: khảo sát xây\
    \ dựng; lập, thẩm định Báo cáo\nnghiên cứu tiền khả thi đầu tư xây dựng, chấp\
    \ thuận chủ trương đầu tư (nếu có);\nlập, thẩm định Báo cáo nghiên cứu khả thi\
    \ đầu tư xây dựng, Báo cáo kinh tế - kỹ\nthuật đầu tư xây dựng và các công việc\
    \ cần thiết khác liên quan đến chuẩn bị dự\nán.\n\n2. Cơ quan, tổ chức được giao\n\
    nhiệm vụ chuẩn bị dự án hoặc chủ đầu tư (trong trường hợp đã xác định được chủ\n\
    đầu tư) tổ chức lập, thẩm định và phê duyệt dự toán chi phí chuẩn bị dự án quy\n\
    định tại khoản 1 Điều này, trừ các trường hợp quy định tại khoản 3, 4 Điều này.\n\
    \n3. Đối với dự án quan trọng quốc\ngia sử dụng vốn đầu tư công, việc lập, thẩm\
    \ định và phê duyệt dự toán chi phí\nchuẩn bị dự án quy định tại khoản 1 Điều\
    \ này thực hiện theo quy định của pháp\nluật về đầu tư công.\n\n4. Đối với dự\
    \ toán chi phí\nthuê tư vấn nước ngoài thực hiện công việc nêu tại khoản 1 Điều\
    \ này thì thẩm\nquyền thẩm định, phê duyệt dự toán thực hiện theo quy định tại\
    \ khoản 4 Điều 32 Nghị định này.\n\n5. Dự toán chi phí chuẩn bị dự án quy định\
    \ tại khoản\n1 Điều này sau khi được phê duyệt được cập nhật vào tổng mức đầu\
    \ tư xây dựng.\n\nChương III\n\nDỰ TOÁN XÂY DỰNG\n\nMục 1. DỰ TOÁN XÂY DỰNG CÔNG\n\
    TRÌNH\n\nĐiều 11. Nội dung dự toán xây\ndựng công trình\n\n1. Dự toán xây dựng\
    \ công trình là toàn bộ chi phí cần\nthiết dự tính để xây dựng công trình được\
    \ xác định theo thiết kế xây dựng triển\nkhai sau thiết kế cơ sở hoặc thiết kế\
    \ bản vẽ thi công trong trường hợp dự án chỉ\nyêu cầu lập Báo cáo kinh tế - kỹ\
    \ thuật đầu tư xây dựng.\n\n2. Nội dung dự toán xây dựng\ncông trình gồm: chi\
    \ phí xây dựng, chi phí thiết bị, chi phí quản lý dự án, chi\nphí tư vấn đầu tư\
    \ xây dựng, chi phí khác và chi phí dự phòng. Các khoản mục chi\nphí trên được\
    \ quy định chi tiết tại các điểm b, c, d, đ, e,\ng khoản 2 Điều 5 Nghị định này,\
    \ trừ các chi phí\ntư vấn đầu tư xây dựng, chi phí khác tính chung cho cả dự án.\n\
    \n3. Đối với dự án có nhiều công\ntrình, chủ đầu tư xác định tổng dự toán để quản\
    \ lý chi phí đầu tư xây dựng\ntrong trường hợp cần thiết. Tổng dự toán gồm các\
    \ dự toán xây dựng công trình và\nchi phí tư vấn, chi phí khác, chi phí dự phòng\
    \ tính chung cho cả dự án.\n\nĐiều 12. Xác định dự toán xây\ndựng công trình\n\
    \n1. Dự toán xây dựng công trình được xác định\ntheo khối lượng tính toán từ thiết\
    \ kế xây dựng triển khai sau thiết kế cơ sở hoặc\nthiết kế bản vẽ thi công trong\
    \ trường hợp dự án chỉ yêu cầu lập Báo cáo kinh tế\n- kỹ thuật đầu tư xây dựng,\
    \ các chỉ dẫn kỹ thuật, yêu cầu công việc phải thực\nhiện, kế hoạch thực hiện\
    \ của công trình, điều kiện thi công, biện pháp thi công\ncủa công trình và định\
    \ mức xây dựng, giá xây dựng công trình, chỉ số giá xây dựng,\ncác quy định khác\
    \ có liên quan được áp dụng phù hợp với điều kiện thực hiện cụ\nthể của công trình.\
    \ Các khoản mục chi phí trong dự toán xây dựng công trình được\nxác định theo\
    \ quy định tại khoản 2, 3, 4, 5, 6, 7 Điều này.\n\n2. Chi phí xây dựng gồm: chi\n\
    phí trực tiếp, chi phí gián tiếp, thu nhập chịu thuế tính trước và thuế giá trị\n\
    gia tăng, được xác định như sau:\n\na) Chi phí trực tiếp (gồm: chi phí vật liệu,\
    \ chi\nphí nhân công, chi phí máy và thiết bị thi công) được xác định theo khối\
    \ lượng\nvà đơn giá xây dựng chi tiết hoặc theo khối lượng và giá xây dựng tổng\
    \ hợp của\nnhóm, loại công tác xây dựng, đơn vị kết cấu hoặc bộ phận công trình.\n\
    \nTrường hợp chi phí trực tiếp được xác định theo khối\nlượng và đơn giá xây dựng\
    \ chi tiết: khối lượng được xác định theo công việc,\ncông tác xây dựng; đơn giá\
    \ xây dựng chi tiết được xác định như quy định tại khoản 2 Điều 24 Nghị định này.\n\
    \nTrường hợp chi phí trực tiếp xác định theo khối lượng\nvà giá xây dựng tổng\
    \ hợp của nhóm, loại công tác xây dựng, đơn vị kết cấu hoặc\nbộ phận công trình:\
    \ khối lượng được xác định phù hợp với nhóm loại công tác xây\ndựng, đơn vị kết\
    \ cấu hoặc bộ phận công trình; giá công tác, nhóm loại công tác\nxây dựng, đơn\
    \ vị kết cấu, bộ phận công trình xác định như quy định tại khoản 3 Điều 24 Nghị\
    \ định này.\n\nb) Chi phí gián tiếp gồm chi phí chung, chi phí nhà\ntạm để ở và\
    \ điều hành thi công và chi phí cho một số công việc không xác định\nđược khối\
    \ lượng từ thiết kế. Chi phí gián tiếp được xác định bằng định mức tỷ lệ\nphần\
    \ trăm (%) theo quy định;\n\nc) Thu nhập chịu thuế tính trước được xác định bằng\n\
    định mức tỷ lệ phần trăm (%);\n\nd) Thuế giá trị gia tăng theo quy định.\n\n3.\
    \ Chi phí thiết bị được xác định\nnhư sau:\n\na) Chi phí mua sắm thiết bị được\
    \ xác định theo khối\nlượng, số lượng, chủng loại thiết bị từ thiết kế (công nghệ,\
    \ xây dựng), danh mục\nthiết bị trong dự án được duyệt và giá mua thiết bị tương\
    \ ứng;\n\nb) Chi phí gia công, chế tạo thiết bị (nếu có) được\nxác định bằng cách\
    \ lập dự toán trên cơ sở khối lượng, số lượng thiết bị cần gia\ncông, chế tạo\
    \ và đơn giá gia công, chế tạo tương ứng; theo hợp đồng gia công, chế\ntạo, báo\
    \ giá của đơn vị sản xuất, cung ứng hoặc trên cơ sở giá gia công, chế tạo\nthiết\
    \ bị tương tự của công trình đã thực hiện;\n\nc) Các chi phí còn lại thuộc chi\
    \ phí thiết bị như\nquy định tại điểm c khoản 2 Điều 5 Nghị định này xác định\
    \ bằng\nphương pháp lập dự toán hoặc trên cơ sở định mức chi phí do cơ quan nhà\
    \ nước có\nthẩm quyền ban hành.\n\n4. Chi phí quản lý dự án được\nxác định theo\
    \ quy định tại Điều 30 Nghị định này.\n\n5. Chi phí tư vấn đầu tư xây dựng\nđược\
    \ xác định theo quy định tại Điều 31 Nghị định này.\n\n6. Chi phí khác được xác\
    \ định\ntrên cơ sở định mức chi phí do cơ quan nhà nước có thẩm quyền ban hành\
    \ hoặc bằng\nphương pháp lập dự toán.\n\n7. Chi phí dự phòng gồm chi\nphí dự phòng\
    \ cho khối lượng, công việc phát sinh và chi phí dự phòng cho yếu tố\ntrượt giá,\
    \ được tính bằng tỷ lệ phần trăm (%) trên tổng các chi phí quy định tại\nkhoản\
    \ 2, 3, 4, 5, 6 Điều này. Riêng tỷ lệ phần trăm (%) đối với chi phí dự\nphòng\
    \ cho yếu tố trượt giá được xác định trên cơ sở thời gian xây dựng công\ntrình\
    \ theo kế hoạch thực hiện dự án, chỉ số giá xây dựng phù hợp với loại công\ntrình\
    \ xây dựng và có tính đến các khả năng biến động giá trong nước và quốc tế.\n\n\
    Điều 13. Thẩm tra, thẩm định dự\ntoán xây dựng công trình\n\n1. Việc thẩm định\
    \ dự toán xây dựng công trình được\nthực hiện đồng thời với việc thẩm định bước\
    \ thiết kế xây dựng triển khai sau\nthiết kế cơ sở theo quy định tại Nghị định\
    \ quy định chi tiết một số nội dung về\nquản lý dự án đầu tư xây dựng.\n\n2. Thẩm\
    \ quyền thẩm định dự\ntoán xây dựng công trình được thực hiện theo quy định của\
    \ Luật Xây dựng và Nghị\nđịnh quy định chi tiết một số nội dung về quản lý dự\
    \ án đầu tư xây dựng.\n\n3. Nội dung thẩm định dự toán\nxây dựng công trình của\
    \ cơ quan chuyên môn về xây dựng quy định tại điểm d khoản 2 Điều 83a Luật Xây\
    \ dựng được bổ sung tại khoản 26 Điều\n1 Luật sửa đổi, bổ sung một số điều của\
    \ Luật Xây dựng, gồm:\n\na) Sự đầy đủ, tính hợp lệ của\nhồ sơ trình thẩm định\
    \ dự toán xây dựng công trình; các căn cứ pháp lý để xác định\ndự toán xây dựng\
    \ công trình;\n\nb) Sự phù hợp của dự toán xây\ndựng công trình với tổng mức đầu\
    \ tư xây dựng đã được phê duyệt; phương pháp xác\nđịnh dự toán xây dựng công trình;\n\
    \nc) Sự phù hợp của nội dung dự\ntoán xây dựng công trình theo quy định tại Điều\
    \ 11 Nghị định\nnày với các nội dung và yêu cầu của dự án;\n\nd) Sự tuân thủ các\
    \ quy định của\npháp luật về việc áp dụng, tham khảo hệ thống định mức xây dựng,\
    \ giá xây dựng\ncông trình và các công cụ cần thiết khác theo quy định do cơ quan\
    \ nhà nước có\nthẩm quyền ban hành, công bố; về việc vận dụng, tham khảo dữ liệu\
    \ về chi phí của\ncông trình tương tự và các công cụ cần thiết khác để xác định\
    \ dự toán xây dựng\ncông trình;\n\nđ) Danh mục định mức dự toán\nmới, định mức\
    \ dự toán điều chỉnh (nếu có) và phương pháp xác định; xác định\ndanh mục các\
    \ định mức cần tổ chức khảo sát trong quá trình thi công xây dựng.\n\n4. Nội dung\
    \ thẩm định dự toán\nxây dựng công trình của chủ đầu tư quy định tại điểm c khoản\n\
    1 Điều 83 Luật Xây dựng được sửa đổi, bổ sung bởi khoản 25 Điều 1 Luật sửa đổi,\n\
    bổ sung một số điều của Luật Xây dựng, gồm:\n\na) Sự đầy đủ của hồ sơ dự toán\
    \ xây dựng công trình\nthẩm định; kiểm tra kết quả thẩm tra dự toán xây dựng công\
    \ trình của tổ chức tư\nvấn (nếu có);\n\nb) Kết quả hoàn thiện, bổ sung hồ sơ\
    \ trình thẩm định\ndự toán xây dựng công trình (nếu có) theo kiến nghị của cơ\
    \ quan chuyên môn về\nxây dựng đối với các trường hợp dự toán xây dựng công trình\
    \ được cơ quan chuyên\nmôn về xây dựng thẩm định quy định tại khoản 3 Điều này\
    \ (nếu có) và các ý kiến\ngiải trình;\n\nc) Sự phù hợp, đầy đủ của việc\nxác định\
    \ khối lượng công tác xây dựng, chủng loại và số lượng thiết bị tính\ntoán trong\
    \ dự toán xây dựng công trình so với thiết kế;\n\nd) Xác định giá trị dự toán\n\
    xây dựng công trình đảm bảo tính đúng, tính đủ theo quy định; phù hợp với giá\n\
    trị tổng mức đầu tư xây dựng; phù hợp với yêu cầu kỹ thuật, công nghệ xây dựng,\n\
    điều kiện thi công, biện pháp thi công xây dựng định hướng, tiến độ thi công\n\
    công trình và mặt bằng giá thị trường;\n\nđ) Phân tích, đánh giá mức độ,\nnguyên\
    \ nhân tăng, giảm của các khoản mục chi phí so với giá trị dự toán xây dựng\n\
    công trình đề nghị thẩm định;\n\ne) Đối với các dự án sử dụng vốn nhà nước ngoài\
    \ đầu\ntư công không thuộc đối tượng phải được cơ quan chuyên môn về xây dựng\
    \ thẩm định,\nchủ đầu tư thẩm định các nội dung quy định tại khoản 3 Điều này\
    \ và các điểm a,\nb, c, d, đ khoản này.\n\n5. Nội dung thẩm định dự toán\nxây\
    \ dựng công trình đối với công trình xây dựng thuộc dự án PPP:\n\na) Đối với các\
    \ công trình xây\ndựng thuộc dự án PPP thành phần sử dụng vốn đầu tư công: cơ\
    \ quan chuyên môn về\nxây dựng thẩm định các nội dung quy định tại khoản 3 Điều\
    \ này; chủ đầu tư thẩm\nđịnh các nội dung quy định tại khoản 4 Điều này và các\
    \ nội dung quy định tại hợp\nđồng dự án PPP;\n\nb) Đối với các công trình xây\
    \ dựng không sử dụng vốn\nđầu tư công thuộc dự án PPP: chủ đầu tư thẩm định theo\
    \ nội dung quy định tại\ncác khoản 3, 4 Điều này và các nội dung quy định tại\
    \ hợp đồng dự án PPP.\n\n6. Chủ đầu tư thẩm định dự\ntoán chi phí các công việc\
    \ chuẩn bị để lập thiết kế xây dựng triển khai sau thiết\nkế cơ sở và các chi\
    \ phí tính chung cho cả dự án. Trường hợp dự toán các chi phí\nnày đã được phê\
    \ duyệt trong tổng mức đầu tư xây dựng, chủ đầu tư xem xét quyết\nđịnh việc chuẩn\
    \ xác lại nếu cần thiết. Trường hợp thuê tư vấn nước ngoài thì thẩm\nquyền thẩm\
    \ định, phê duyệt dự toán chi phí thuê tư vấn nước ngoài thực hiện\ntheo quy định\
    \ tại khoản 4 Điều 32 Nghị định này.\n\n7. Việc thẩm tra phục vụ thẩm định dự\
    \ toán xây dựng\ncông trình thực hiện theo quy định tại Nghị định quy định chi\
    \ tiết một số nội\ndung về quản lý dự án đầu tư xây dựng.\n\n8. Chi phí cho tổ\
    \ chức, cá nhân tham gia thẩm định\nđược trích từ phí, chi phí thẩm định dự toán\
    \ xây dựng.\n\n9. Bộ Xây dựng quy định chi\nphí thẩm tra dự toán xây dựng. Bộ\
    \ Tài chính quy định phí thẩm định dự toán xây\ndựng.\n\nĐiều 14. Phê duyệt dự\
    \ toán xây\ndựng công trình\n\n1. Thẩm quyền phê duyệt dự toán xây dựng công trình\n\
    theo quy định tại Điều 82 Luật Xây dựng được sửa đổi, bổ\nsung tại khoản 24, 25\
    \ Điều 1 Luật sửa đổi, bổ sung một số điều\ncủa Luật Xây dựng.\n\n2. Chủ đầu tư\
    \ phê duyệt dự\ntoán chi phí các công việc chuẩn bị để lập thiết kế xây dựng triển\
    \ khai sau thiết\nkế cơ sở và các chi phí tính chung cho cả dự án.\n\n3. Quyết\
    \ định phê duyệt dự toán xây dựng công trình\nvà dự toán chi phí quy định tại\
    \ khoản 2 Điều này được gửi cho người quyết định\nđầu tư.\n\nĐiều 15. Điều chỉnh\
    \ dự toán\nxây dựng công trình\n\n1. Dự toán xây dựng công trình đã phê duyệt\
    \ được điều\nchỉnh theo quy định tại khoản 4 Điều 135 Luật Xây dựng.\n\n2. Dự\
    \ toán xây dựng công trình điều chỉnh gồm phần\ndự toán xây dựng công trình không\
    \ điều chỉnh và phần dự toán xây dựng công\ntrình điều chỉnh. Các nội dung liên\
    \ quan đến phần dự toán xây dựng công trình\nđiều chỉnh phải được thẩm định theo\
    \ quy định tại Điều 13 Nghị định\nnày.\n\n3. Thẩm quyền thẩm định, phê\nduyệt\
    \ dự toán xây dựng công trình điều chỉnh thực hiện theo quy định về thẩm\nquyền\
    \ thẩm định, phê duyệt điều chỉnh thiết kế xây dựng triển khai sau thiết kế\n\
    cơ sở tại Nghị định quy định chi tiết một số nội dung về quản lý dự án đầu tư\n\
    xây dựng.\n\n4. Trường hợp dự toán xây dựng\ncông trình điều chỉnh vượt dự toán\
    \ đã phê duyệt nhưng không vượt tổng mức đầu\ntư xây dựng đã được phê duyệt, chủ\
    \ đầu tư tổ chức điều chỉnh, báo cáo người quyết\nđịnh đầu tư chấp thuận trước\
    \ khi phê duyệt.\n\n5. Việc điều chỉnh dự toán\nkhông vượt dự toán đã phê duyệt\
    \ nhưng làm thay đổi cơ cấu các khoản mục chi phí\ntrong tổng mức đầu tư xây dựng\
    \ thì chủ đầu tư tự tổ chức điều chỉnh, phê duyệt,\nbáo cáo người quyết định đầu\
    \ tư và chịu trách nhiệm về kết quả điều chỉnh.\n\nMục 2. DỰ TOÁN GÓI THẦU XÂY\
    \ DỰNG\n\nĐiều 16. Quy định chung về dự\ntoán gói thầu xây dựng\n\n1. Dự toán\
    \ gói thầu xây dựng (sau đây gọi là dự\ntoán gói thầu) là toàn bộ chi phí cần\
    \ thiết để thực hiện gói thầu được xác định\ncho từng gói thầu, phù hợp với kế\
    \ hoạch lựa chọn nhà thầu trước khi tổ chức lựa\nchọn nhà thầu.\n\n2. Dự toán\
    \ gói thầu được xác định cho các gói thầu\nsau:\n\na) Gói thầu thi công xây dựng;\n\
    \nb) Gói thầu mua sắm thiết bị;\n\nc) Gói thầu lắp đặt thiết bị;\n\nd) Gói thầu\
    \ tư vấn đầu tư xây dựng;\n\nđ) Gói thầu hỗn hợp.\n\nĐiều 17. Xác định dự toán\
    \ gói\nthầu\n\n1. Dự toán gói thầu được xác định trên cơ sở các\nkhoản mục chi\
    \ phí thuộc phạm vi của từng gói thầu phù hợp với thiết kế, phạm\nvi, tính chất,\
    \ đặc điểm, điều kiện cụ thể của gói thầu.\n\n2. Đối với dự án thực hiện thiết\n\
    kế kỹ thuật tổng thể (FEED) để triển khai hợp đồng thiết kế - mua sắm vật tư,\n\
    thiết bị - thi công xây dựng công trình (EPC), dự toán gói thầu được xác định\n\
    trên cơ sở các khoản mục chi phí thuộc phạm vi gói thầu xác định trên cơ sở thiết\n\
    kế FEED.\n\n3. Đối với dự án, công trình\nđược người quyết định đầu tư cho phép\
    \ triển khai thiết kế xây dựng triển khai\nsau thiết kế cơ sở theo từng gói thầu\
    \ xây dựng, từng giai đoạn kế hoạch thực hiện\ndự án thì dự toán gói thầu được\
    \ xác định trên cơ sở các khoản mục chi phí thuộc\nphạm vi gói thầu và thiết kế\
    \ xây dựng tương ứng. Các khoản mục chi phí trong dự\ntoán gói thầu được xác định\
    \ như các khoản mục chi phí trong dự toán xây dựng\ncông trình quy định tại Điều\
    \ 12 Nghị định này, phù hợp với phạm vi, tính chất, đặc điểm, điều kiện cụ\nthể\
    \ của từng gói thầu.\n\n4. Đối với dự án đã được phê\nduyệt dự toán xây dựng công\
    \ trình, chủ đầu tư tự xác định dự toán gói thầu trên\ncơ sở các khoản mục chi\
    \ phí thuộc phạm vi của gói thầu trong dự toán xây dựng\ncông trình được duyệt\
    \ nếu cần thiết.\n\n5. Chi phí dự phòng trong dự toán gói thầu được xác\nđịnh\
    \ phù hợp với hình thức hợp đồng sử dụng cho gói thầu ghi trong kế hoạch lựa\n\
    chọn nhà thầu.\n\nĐiều 18. Thẩm tra, thẩm định, phê\nduyệt dự toán gói thầu\n\n\
    1. Việc thẩm tra, thẩm định dự toán gói thầu quy định\ntại khoản 2, 3 Điều 17\
    \ Nghị định này thực hiện như đối với\ndự toán xây dựng công trình quy định tại\
    \ Điều 13 Nghị định này.\n\n2. Chủ đầu tư phê duyệt dự toán gói thầu quy định\
    \ tại\nkhoản 2, 3, 4 Điều 17 Nghị định này để thay thế giá gói thầu\ntrong kế\
    \ hoạch lựa chọn nhà thầu theo quy định của pháp luật về đấu thầu.\n\n3. Chủ đầu\
    \ tư tự thẩm định,\nphê duyệt dự toán gói thầu quy định tại điểm d khoản 2 Điều\n\
    16 Nghị định này. Trường hợp thuê tư vấn nước\nngoài thì thẩm quyền thẩm định,\
    \ phê duyệt dự toán gói thầu tư vấn nước ngoài thực\nhiện theo quy định tại khoản\
    \ 4 Điều 32 Nghị định này.\n\n4. Tùy theo đặc điểm, tính chất của gói thầu, việc\n\
    điều chỉnh các khoản mục chi phí trong dự toán gói thầu quy định tại khoản 2,\
    \ 3 Điều 17 Nghị định này được thực hiện như quy định đối\nvới điều chỉnh dự toán\
    \ xây dựng công trình tại Điều 15 Nghị định\nnày.\n\nĐiều 19. Giá gói thầu xây\
    \ dựng\n\n1. Giá gói thầu xây dựng là giá trị của gói thầu\nxây dựng được phê\
    \ duyệt trong kế hoạch lựa chọn nhà thầu làm cơ sở để lựa chọn\nnhà thầu. Giá\
    \ gói thầu xây dựng gồm toàn bộ chi phí cần thiết được tính đúng,\ntính đủ để\
    \ thực hiện gói thầu xây dựng, kể cả chi phí dự phòng, phí, lệ phí và\nthuế.\n\
    \n2. Giá gói thầu được cập nhật trước ngày mở thầu\ntheo quy định của pháp luật\
    \ về đấu thầu nếu cần thiết.\n\nChương IV\n\nĐỊNH MỨC XÂY DỰNG, GIÁ\nXÂY DỰNG\
    \ CÔNG TRÌNH VÀ CHỈ SỐ GIÁ XÂY DỰNG\n\nMục 1. ĐỊNH MỨC XÂY DỰNG\n\nĐiều 20. Hệ\
    \ thống định mức xây\ndựng\n\n1. Hệ thống định mức xây dựng gồm định mức kinh\
    \ tế-kỹ\nthuật và định mức chi phí. Định mức kinh tế - kỹ thuật gồm định mức cơ\
    \ sở và định\nmức dự toán.\n\n2. Định mức cơ sở gồm định mức sử dụng vật liệu,\
    \ định\nmức năng suất lao động, định mức năng suất máy và thiết bị thi công được\
    \ xác định\nphù hợp với yêu cầu kỹ thuật, quy chuẩn, tiêu chuẩn xây dựng và được\
    \ sử dụng để\nxác định hoặc điều chỉnh định mức dự toán.\n\n3. Định mức dự toán\n\
    \na) Định mức dự toán là mức hao phí cần thiết về vật\nliệu, nhân công, máy và\
    \ thiết bị thi công được xác định phù hợp với yêu cầu kỹ\nthuật, điều kiện thi\
    \ công và biện pháp thi công cụ thể để hoàn thành một đơn vị\nkhối lượng công\
    \ tác xây dựng công trình;\n\nb) Định mức dự toán được áp dụng, tham khảo để lập\n\
    dự toán xây dựng, là căn cứ để xác định giá xây dựng công trình, làm cơ sở để\
    \ lập\nvà quản lý chi phí đầu tư xây dựng.\n\n4. Định mức chi phí gồm: định mức\
    \ tính bằng tỷ lệ\nphần trăm (%) và định mức tính bằng giá trị. Định mức chi phí\
    \ là cơ sở để xác định\ngiá xây dựng công trình, dự toán chi phí của một số loại\
    \ công việc, chi phí trong\nđầu tư xây dựng như chi phí gián tiếp, thu nhập chịu\
    \ thuế tính trước, chi phí\nquản lý dự án, chi phí tư vấn đầu tư xây dựng và một\
    \ số nội dung chi phí khác.\n\n5. Định mức dự toán cho các\ncông tác xây dựng\
    \ đặc thù của chuyên ngành, của địa phương là định mức cho các\ncông tác chưa\
    \ được quy định trong hệ thống định mức xây dựng do Bộ Xây dựng ban\nhành và chỉ\
    \ xuất hiện trong các công trình xây dựng thuộc chuyên ngành quản lý\nhoặc tại\
    \ địa phương.\n\n6. Bộ Xây dựng tổ chức xây dựng,\nban hành định mức xây dựng\
    \ sử dụng chung trong phạm vi cả nước. Bộ quản lý công\ntrình xây dựng chuyên\
    \ ngành tổ chức xây dựng, ban hành định mức dự toán cho các\ncông tác xây dựng\
    \ đặc thù của chuyên ngành, Ủy ban nhân dân cấp tỉnh tổ chức\nxây dựng, ban hành\
    \ định mức dự toán cho các công tác xây dựng đặc thù của địa\nphương.\n\n7. Bộ\
    \ quản lý công trình xây dựng\nchuyên ngành, Ủy ban nhân dân cấp tỉnh lập kế hoạch\
    \ và tổ chức xây dựng định mức\ndự toán quy định tại khoản 5 Điều này, gửi Bộ\
    \ Xây dựng cho ý kiến về phương\npháp, căn cứ xây dựng định mức, sự phù hợp của\
    \ kết quả tính toán các thành phần\nhao phí trước khi ban hành.\n\n8. Việc áp\
    \ dụng, tham khảo hệ thống định mức xây dựng\nthực hiện theo quy định tại khoản\
    \ 3 Điều 136 Luật Xây dựng\nđược sửa đổi, bổ sung tại khoản 51 Điều 1 Luật sửa\
    \ đổi, bổ sung\nmột số điều của Luật Xây dựng.\n\n9. Hệ thống định mức xây dựng\
    \ quy định tại Điều này\nđược quản lý theo hệ thống mã hiệu theo quy định của\
    \ Bộ trưởng Bộ Xây dựng.\n\nĐiều 21. Xác định định mức dự\ntoán mới, điều chỉnh\
    \ định mức dự toán để áp dụng cho công trình\n\n1. Việc xác định định mức dự toán\
    \ mới cho công\ntrình được thực hiện đối với các công tác xây dựng chưa được quy\
    \ định hoặc đã\nđược quy định nhưng sử dụng công nghệ thi công mới, biện pháp\
    \ thi công, điều kiện\nthi công chưa quy định trong hệ thống định mức xây dựng\
    \ đã được cơ quan nhà nước\ncó thẩm quyền ban hành.\n\n2. Việc điều chỉnh định\
    \ mức dự toán được thực hiện\nđối với công tác xây dựng đã quy định trong hệ thống\
    \ định mức xây dựng được cơ\nquan nhà nước có thẩm quyền ban hành nhưng chưa phù\
    \ hợp với thiết kế, yêu cầu kỹ\nthuật, điều kiện thi công, biện pháp thi công\
    \ của công trình.\n\n3. Việc xác định định mức dự\ntoán mới, điều chỉnh định mức\
    \ dự toán thực hiện theo quy định của Bộ trưởng Bộ\nXây dựng.\n\n4. Trong quá\
    \ trình lập dự toán\nxây dựng, việc xác định và quản lý các định mức dự toán mới,\
    \ định mức dự toán\nđiều chỉnh quy định tại khoản 1, 2 Điều này được thực hiện\
    \ như sau:\n\na) Tổ chức, cá nhân lập dự\ntoán xây dựng có trách nhiệm lập danh\
    \ mục các định mức dự toán mới, định mức dự\ntoán cần điều chỉnh cho phù hợp với\
    \ yêu cầu đặc thù của công trình và tổ chức\nxác định các hao phí định mức phù\
    \ hợp với thiết kế, yêu cầu kỹ thuật, điều kiện\nthi công, biện pháp thi công\
    \ dự kiến để phục vụ việc lập đơn giá, xác định dự\ntoán xây dựng;\n\nb) Cơ quan\
    \ chuyên môn về xây dựng thẩm định các nội\ndung liên quan theo quy định tại điểm\
    \ đ khoản 3 Điều 13 Nghị định\nnày;\n\nc) Chủ đầu tư xem xét, quyết định việc\
    \ sử dụng các\nđịnh mức dự toán điều chỉnh, định mức dự toán mới cho công trình\
    \ làm cơ sở xác\nđịnh giá xây dựng công trình.\n\n5. Trong quá trình thi công\n\
    xây dựng, chủ đầu tư tổ chức khảo sát để xác định các định mức dự toán mới, định\n\
    mức dự toán điều chỉnh quy định tại khoản 4 Điều này như sau:\n\na) Tổ chức chuẩn\
    \ xác lại các nội dung của định mức\n(gồm quy định áp dụng, thành phần công việc,\
    \ thành phần hao phí, đơn vị tính,\ntrị số định mức) trên cơ sở khảo sát, thu\
    \ thập số liệu từ quá trình thi công thực\ntế;\n\nb) Kết quả xác định định mức\
    \ được gửi về cơ quan\nchuyên môn về xây dựng phục vụ rà soát, hoàn thiện hệ thống\
    \ định mức xây dựng\nquy định tại Điều 20 Nghị định này để cập nhật vào hệ thống\n\
    cơ sở dữ liệu quy định tại Điều 28 Nghị định này.\n\n6. Trường hợp chủ đầu tư\
    \ có\nyêu cầu, Bộ Xây dựng hướng dẫn và có ý kiến đối với các định mức dự toán\
    \ mới,\ncơ quan ban hành định mức hướng dẫn và có ý kiến đối với định mức dự toán\
    \ điều\nchỉnh quy định tại khoản 4, 5 Điều này.\n\n7. Chủ đầu tư được thuê tổ\
    \ chức tư vấn quản lý chi\nphí đủ điều kiện năng lực theo quy định tại Nghị định\
    \ quy định chi tiết một số\nnội dung về quản lý dự án đầu tư xây dựng để xác định,\
    \ thẩm tra các định mức\nquy định tại khoản 5 Điều này.\n\nĐiều 22. Rà soát, cập\
    \ nhật hệ\nthống định mức xây dựng do cơ quan quản lý nhà nước có thẩm quyền ban\
    \ hành\n\n1. Bộ Xây dựng, Bộ quản lý công trình xây dựng\nchuyên ngành, Ủy ban\
    \ nhân dân cấp tỉnh tổ chức rà soát và hướng dẫn việc áp dụng,\ntham khảo các\
    \ định mức xây dựng đã ban hành, công bố theo thẩm quyền trước ngày\nNghị định\
    \ này có hiệu lực theo nguyên tắc:\n\na) Hoàn thành việc rà soát, hủy bỏ các định\
    \ mức\nkhông còn phù hợp, ban hành các định mức không phải điều chỉnh trước ngày\
    \ 30\ntháng 6 năm 2021;\n\nb) Tổ chức khảo sát, xác định các định mức cần điều\n\
    chỉnh, bổ sung và ban hành trước ngày 31 tháng 12 năm 2021;\n\nc) Trong thời gian\
    \ tổ chức rà soát, khảo sát, điều\nchỉnh định mức, Bộ Xây dựng, Bộ quản lý công\
    \ trình xây dựng chuyên ngành, Ủy\nban nhân dân cấp tỉnh chịu trách nhiệm hướng\
    \ dẫn việc áp dụng, tham khảo các định\nmức do mình công bố, ban hành theo thẩm\
    \ quyền và các công cụ cần thiết khác để\nlập và quản lý chi phí đầu tư xây dựng.\n\
    \n2. Hệ thống định mức xây dựng do Bộ Xây dựng, Bộ quản\nlý công trình xây dựng\
    \ chuyên ngành và Ủy ban nhân dân cấp tỉnh ban hành phải\nđược rà soát, cập nhật\
    \ định kỳ 03 năm một lần kể từ ngày định mức được ban hành\nhoặc sớm hơn khi cần\
    \ thiết.\n\n3. Bộ Xây dựng chịu trách nhiệm về việc tổ chức,\nđôn đốc rà soát,\
    \ cập nhật toàn bộ hệ thống định mức xây dựng và ban hành các\nquy định, hướng\
    \ dẫn thực hiện công tác rà soát, cập nhật định mức xây dựng.\n\n4. Các Bộ quản\
    \ lý công trình xây dựng chuyên ngành,\nỦy ban nhân dân cấp tỉnh thực hiện việc\
    \ rà soát, cập nhật, ban hành định mức dự\ntoán quy định tại khoản 6 Điều 20 như\
    \ sau:\n\na) Xác định danh mục, lập kế hoạch rà soát định mức\nhàng năm và gửi\
    \ về Bộ Xây dựng để theo dõi phối hợp, kiểm tra trong quá trình\nthực hiện;\n\n\
    b) Giao cơ quan chuyên môn về xây dựng trực thuộc tổ\nchức rà soát, thuê tổ chức,\
    \ cá nhân đủ điều kiện năng lực hoạt động, hành nghề\ntheo quy định tại Nghị định\
    \ quy định chi tiết một số nội dung về quản lý dự án\nđầu tư xây dựng để thực\
    \ hiện rà soát, xác định các định mức mới, định mức điều\nchỉnh, trình cấp có\
    \ thẩm quyền ban hành theo quy định;\n\nc) Quyết định việc ban hành\ncác định\
    \ mức sau khi có ý kiến của Bộ Xây dựng như quy định tại khoản 7 Điều 20 Nghị\
    \ định này và gửi\nvề Bộ Xây dựng để tổng hợp, cập nhật vào cơ sở dữ liệu.\n\n\
    5. Cơ quan chuyên môn về xây dựng theo phân cấp tổng\nhợp kết quả xây dựng định\
    \ mức được quy định tại khoản 4, 5 Điều\n21 Nghị định này và các định mức quy\
    \ định tại khoản 6 Điều này gửi về Bộ\nXây dựng (đối với các định mức dự toán\
    \ mới) và cơ quan ban hành định mức (đối với\ncác định mức dự toán điều chỉnh)\
    \ phục vụ việc rà soát, xem xét, quyết định cập\nnhật hệ thống định mức.\n\n6.\
    \ Khuyến khích các tổ chức, cá nhân tự tổ chức xác\nđịnh các định mức dự toán\
    \ mới, định mức dự toán điều chỉnh và gửi kết quả về cơ\nquan chuyên môn về xây\
    \ dựng để phục vụ công tác quản lý nhà nước.\n\nĐiều 23. Kinh phí rà soát, cập\n\
    nhật và xây dựng, điều chỉnh định mức xây dựng\n\n1. Kinh phí rà soát, cập nhật\
    \ định mức xây dựng do\nBộ Xây dựng, các Bộ quản lý công trình xây dựng chuyên\
    \ ngành và Ủy ban nhân dân\ncấp tỉnh thực hiện gồm: kinh phí lập kế hoạch, tổ\
    \ chức rà soát; khảo sát, xác định,\nthẩm định; cập nhật định mức mới, định mức\
    \ điều chỉnh. Kinh phí này được bố trí\ntừ nguồn ngân sách hàng năm.\n\n2. Kinh\
    \ phí cho việc xây dựng\nđịnh mức mới, điều chỉnh định mức quy định tại khoản\
    \ 4, 5\nĐiều 21 Nghị định này được tính vào chi phí đầu\ntư xây dựng của dự án.\n\
    \nMục 2. GIÁ XÂY DỰNG CÔNG TRÌNH\nVÀ CHỈ SỐ GIÁ XÂY DỰNG\n\nĐiều 24. Giá xây dựng\
    \ công\ntrình\n\n1. Giá xây dựng công trình gồm đơn giá xây dựng chi\ntiết và\
    \ giá xây dựng tổng hợp, làm cơ sở để xác định tổng mức đầu tư xây dựng,\ndự toán\
    \ xây dựng.\n\na) Đơn giá xây dựng chi tiết được xác định cho các\ncông tác xây\
    \ dựng;\n\nb) Giá xây dựng tổng hợp được xác định theo nhóm,\nloại công tác xây\
    \ dựng, đơn vị kết cấu hoặc bộ phận công trình.\n\n2. Đơn giá xây dựng chi tiết\
    \ của\ncông trình được xác định trên cơ sở định mức xây dựng, giá vật tư, vật\
    \ liệu, cấu\nkiện xây dựng, giá nhân công, giá ca máy và thiết bị thi công và\
    \ các yếu tố chi\nphí cần thiết khác phù hợp với mặt bằng giá thị trường khu vực\
    \ xây dựng công\ntrình tại thời điểm xác định và các quy định khác có liên quan\
    \ hoặc theo đơn\ngiá xây dựng công trình do Ủy ban nhân dân cấp tỉnh công bố hoặc\
    \ được xác định\ntrên cơ sở giá thị trường hoặc theo giá tương tự ở các công trình\
    \ đã thực hiện.\n\n3. Giá xây dựng tổng hợp của công trình được xác định\ntrên\
    \ cơ sở tổng hợp từ các đơn giá xây dựng chi tiết cho một đơn vị tính của\nnhóm\
    \ công tác, đơn vị kết cấu, bộ phận công trình, theo giá được công bố của cơ\n\
    quan nhà nước có thẩm quyền hoặc được xác định trên cơ sở giá thị trường hoặc\n\
    theo giá tương tự ở các công trình đã thực hiện.\n\nĐiều 25. Suất vốn đầu tư xây\
    \ dựng\n\n1. Suất vốn đầu tư xây dựng là mức chi phí cần thiết\ncho một đơn vị\
    \ tính theo diện tích, thể tích, chiều dài hoặc công suất hoặc\nnăng lực phục\
    \ vụ của công trình theo thiết kế, là căn cứ để xác định sơ bộ tổng\nmức đầu tư\
    \ xây dựng, tổng mức đầu tư xây dựng.\n\n2. Suất vốn đầu tư xây dựng gồm:\nchi\
    \ phí xây dựng; chi phí thiết bị; chi phí quản lý dự án; chi phí tư vấn đầu\n\
    tư xây dựng; một số khoản mục chi phí khác và thuế giá trị gia tăng cho các chi\n\
    phí nêu trên. Suất vốn đầu tư xây dựng chưa gồm chi phí dự phòng và chi phí thực\n\
    hiện một số loại công việc theo yêu cầu riêng của dự án, công trình.\n\nĐiều 26.\
    \ Quản lý giá xây dựng\ncông trình, suất vốn đầu tư xây dựng\n\n1. Bộ Xây dựng\
    \ hướng dẫn\nphương pháp xác định giá xây dựng công trình, suất vốn đầu tư xây\
    \ dựng và công\nbố giá xây dựng tổng hợp, suất vốn đầu tư xây dựng theo định kỳ.\n\
    \n2. Ủy ban nhân dân cấp tỉnh\ncông bố đơn giá xây dựng công trình của địa phương;\
    \ phân cấp, ủy quyền cho Sở\nXây dựng công bố các thông tin về giá xây dựng trên\
    \ địa bàn tỉnh theo quy định\ntại điểm a, b khoản này như sau:\n\na) Giá các loại\
    \ vật liệu xây dựng, thiết bị công\ntrình: công bố theo định kỳ hàng quý hoặc\
    \ sớm hơn khi cần thiết;\n\nb) Đơn giá nhân công xây dựng, giá ca máy và thiết\n\
    bị thi công, giá thuê máy và thiết bị thi công xây dựng: công bố theo định kỳ\n\
    hàng năm hoặc sớm hơn khi cần thiết.\n\n3. Chủ đầu tư sử dụng hệ thống\ngiá xây\
    \ dựng công trình quy định tại khoản 1, 2 Điều này làm cơ sở xác định tổng\nmức\
    \ đầu tư xây dựng, dự toán xây dựng và quản lý chi phí đầu tư xây dựng hoặc tổ\n\
    chức xác định giá xây dựng công trình phù hợp với yêu cầu kỹ thuật, điều kiện\n\
    thi công, biện pháp thi công và kế hoạch thực hiện cụ thể của công trình.\n\n\
    4. Chủ đầu tư được thuê các tổ chức, cá nhân tư vấn\nquản lý chi phí đầu tư xây\
    \ dựng có đủ điều kiện năng lực hoạt động, hành nghề\ntheo quy định tại Nghị định\
    \ quy định chi tiết một số nội dung về quản lý dự án\nđầu tư xây dựng thực hiện\
    \ các công việc hoặc phần công việc liên quan tới việc\nxác định, thẩm tra giá\
    \ xây dựng công trình được quy định tại khoản 3 Điều này.\n\n5. Kinh phí cho việc\
    \ thu thập\nsố liệu, xác định và công bố giá xây dựng công trình, các thông tin\
    \ về giá và\nsuất vốn đầu tư xây dựng quy định tại khoản 1, 2 Điều này được bố\
    \ trí từ nguồn\nngân sách hàng năm.\n\nĐiều 27. Chỉ số giá xây dựng\n\n1. Chỉ\
    \ số giá xây dựng là chỉ tiêu phản ánh mức độ\nbiến động của giá xây dựng theo\
    \ thời gian, làm cơ sở xác định, điều chỉnh sơ bộ\ntổng mức đầu tư xây dựng, tổng\
    \ mức đầu tư xây dựng, dự toán xây dựng, giá gói\nthầu xây dựng, giá hợp đồng\
    \ xây dựng, quy đổi vốn đầu tư xây dựng công trình và\nquản lý chi phí đầu tư\
    \ xây dựng.\n\n2. Chỉ số giá xây dựng gồm chỉ\nsố giá xây dựng theo loại công\
    \ trình, theo ca cấu chi phí (gồm chỉ số giá phần\nxây dựng, chỉ số giá phần thiết\
    \ bị, chỉ số giá phần chi phí khác), yếu tố chi\nphí (gồm chỉ số giá vật liệu\
    \ xây dựng công trình, chỉ số giá nhân công xây dựng,\nchỉ số giá máy và thiết\
    \ bị thi công xây dựng) và chỉ số giá của một số vật liệu\nchủ yếu.\n\n3. Việc\
    \ xây dựng, công bố chỉ\nsố giá xây dựng được thực hiện như sau:\n\na) Bộ Xây\
    \ dựng hướng dẫn\nphương pháp xác định chỉ số giá xây dựng; xác định và công bố\
    \ chỉ số giá xây dựng\nquốc gia theo năm;\n\nb) Sở Xây dựng tổ chức xác định\n\
    chỉ số giá xây dựng trên địa bàn tỉnh theo phương pháp do Bộ Xây dựng hướng dẫn\n\
    (gồm đủ các chỉ số giá quy định tại khoản 2 Điều này) làm cơ sở để Ủy ban nhân\n\
    dân cấp tỉnh công bố hoặc phân cấp, ủy quyền cho Sở Xây dựng công bố theo định\n\
    kỳ hàng quý, hàng năm hoặc sớm hơn khi cần thiết; đồng thời gửi về Bộ Xây dựng\n\
    để theo dõi, quản lý.\n\n4. Trường hợp sử dụng chỉ số\ngiá xây dựng để điều chỉnh\
    \ giá hợp đồng xây dựng, đối với các công trình chưa\ncó trong danh mục chỉ số\
    \ giá xây dựng do Bộ Xây dựng hoặc Ủy ban nhân dân cấp tỉnh\ncông bố thì chủ đầu\
    \ tư tổ chức xác định chỉ số giá theo phương pháp do Bộ Xây dựng\nhướng dẫn, gửi\
    \ Bộ Xây dựng (đối với công trình xây dựng theo tuyến trên địa bàn\n02 đơn vị\
    \ hành chính cấp tỉnh trở lên) hoặc Ủy ban nhân dân cấp tỉnh (đối với\ncông trình\
    \ xây dựng trên địa bàn tỉnh) cho ý kiến về sự phù hợp của phương pháp\nxác định\
    \ chỉ số giá xây dựng, tính đúng đắn, hợp lý của việc xác định chỉ số\ngiá.\n\n\
    5. Chủ đầu tư được thuê tổ chức, cá nhân tư vấn quản\nlý chi phí đủ điều kiện\
    \ năng lực hoạt động, hành nghề theo quy định tại Nghị định\nquy định chi tiết\
    \ một số nội dung về quản lý dự án đầu tư xây dựng để tính toán\nchỉ số giá xây\
    \ dựng tại khoản 4 Điều này.\n\n6. Kinh phí cho việc thu thập số liệu, xác định\
    \ và\ncông bố chỉ số giá xây dựng quy định tại khoản 3 Điều này được bố trí từ\
    \ nguồn\nngân sách hàng năm.\n\nMục 3. CƠ SỞ DỮ LIỆU VỀ ĐỊNH MỨC\nXÂY DỰNG, GIÁ\
    \ XÂY DỰNG CÔNG TRÌNH VÀ CHỈ SỐ GIÁ XÂY DỰNG\n\nĐiều 28. Hệ thống cơ sở dữ liệu\n\
    về định mức xây dựng, giá xây dựng công trình và chỉ số giá xây dựng\n\n1. Hệ\
    \ thống cơ sở dữ liệu về định mức xây dựng, giá\nxây dựng công trình và chỉ số\
    \ giá xây dựng (gọi tắt là hệ thống cơ sở dữ liệu)\nlà một bộ phận của hệ thống\
    \ thông tin, cơ sở dữ liệu quốc gia về hoạt động xây\ndựng theo Luật Xây dựng,\
    \ gồm:\n\na) Các thông tin, dữ liệu về định mức xây dựng, giá\nxây dựng công trình,\
    \ suất vốn đầu tư xây dựng, chỉ số giá xây dựng do các cơ\nquan nhà nước có thẩm\
    \ quyền ban hành hoặc công bố;\n\nb) Cơ sở dữ liệu về các dự án đầu tư xây dựng,\
    \ hợp\nđồng xây dựng thu thập được thông qua các cuộc điều tra, khảo sát hoặc\
    \ do các tổ\nchức, cá nhân cung cấp theo cơ chế phối hợp, chia sẻ thông tin và\
    \ chế độ báo\ncáo thống kê định kỳ theo quy định của pháp luật;\n\nc) Cơ sở dữ\
    \ liệu về giá các dịch vụ xây dựng, sản\nphẩm xây dựng, vật liệu và thiết bị xây\
    \ dựng và các thông tin khác có liên quan\ndo các tổ chức, cá nhân hoạt động xây\
    \ dựng cung cấp hoặc thông qua điều tra, khảo\nsát.\n\n2. Bộ Xây dựng chịu trách\
    \ nhiệm xây dựng, quản lý,\nvận hành hệ thống cơ sở dữ liệu trên phạm vi cả nước,\
    \ là đầu mối kết nối các hệ\nthống cơ sở dữ liệu của các Bộ quản lý công trình\
    \ xây dựng chuyên ngành và địa\nphương; cung cấp thông tin, dữ liệu trong hệ thống\
    \ cơ sở dữ liệu phục vụ công\ntác quản lý nhà nước và theo yêu cầu của các tổ\
    \ chức, cá nhân để lập và quản lý\nchi phí đầu tư xây dựng theo quy định của pháp\
    \ luật.\n\n3. Bộ quản lý công trình xây dựng chuyên ngành, Ủy\nban nhân dân cấp\
    \ tỉnh có trách nhiệm xây dựng, quản lý, vận hành hệ thống cơ sở\ndữ liệu để phục\
    \ vụ công tác quản lý nhà nước về chi phí đầu tư xây dựng trong\nlĩnh vực ngành,\
    \ địa phương.\n\n4. Nguyên tắc xây dựng và quản lý hệ thống cơ sở dữ\nliệu:\n\n\
    a) Hệ thống cơ sở dữ liệu phải bảo đảm kết nối đồng\nbộ và phù hợp với các quy\
    \ định của pháp luật; phục vụ kịp thời công tác quản lý\nnhà nước và đáp ứng yêu\
    \ cầu phát triển kinh tế - xã hội;\n\nb) Các thông tin, dữ liệu trước khi cập\
    \ nhật vào hệ\nthống cơ sở dữ liệu phải được kiểm tra, rà soát, đánh giá và phân\
    \ loại phù hợp;\n\nc) Việc thu thập, bổ sung các thông tin, dữ liệu phải\nbảo\
    \ đảm không trùng lặp, chồng chéo nhiệm vụ; có sự phối hợp chặt chẽ trong việc\n\
    thu thập thông tin, dữ liệu; tận dụng tối đa nguồn thông tin, dữ liệu sẵn có;\n\
    \nd) Thông tin, dữ liệu đã được kiểm tra, xử lý và cập\nnhật theo quy định trong\
    \ hệ thống cơ sở dữ liệu có giá trị pháp lý như hồ sơ,\nvăn bản dạng giấy;\n\n\
    đ) Các cơ quan, tổ chức và cá nhân chịu trách nhiệm\npháp lý đối với các thông\
    \ tin, dữ liệu do mình cung cấp, cập nhật cho hệ thống\ncơ sở dữ liệu.\n\nĐiều\
    \ 29. Quản lý hệ thống cơ sở\ndữ liệu\n\n1. Bộ Xây dựng có trách nhiệm xây dựng,\
    \ quản lý, vận\nhành và kiểm soát toàn diện hệ thống cơ sở dữ liệu trên phạm vi\
    \ cả nước:\n\na) Xây dựng Quy chế quản lý, khai thác, sử dụng hệ\nthống cơ sở\
    \ dữ liệu; cấp và quản lý tài khoản đăng nhập vào hệ thống cơ sở dữ\nliệu; kiểm\
    \ soát nội dung được cập nhật, điều chỉnh, đăng tải trong hệ thống cơ\nsở dữ liệu;\n\
    \nb) Hướng dẫn nội dung, phương pháp xây dựng cơ sở dữ\nliệu (gồm thu thập, tổng\
    \ hợp, xử lý, cập nhật, lưu trữ thông tin, dữ liệu);\n\nc) Hướng dẫn việc khai\
    \ thác, sử dụng hệ thống cơ sở\ndữ liệu;\n\nd) Xây dựng và hoàn thiện hệ thống\
    \ mã hiệu, hệ thống\nphần mềm ứng dụng để quản lý hệ thống cơ sở dữ liệu.\n\n\
    2. Bộ quản lý công trình xây dựng chuyên ngành có\ntrách nhiệm tổng hợp, cung\
    \ cấp các định mức dự toán công tác xây dựng đặc thù của\nchuyên ngành; giá xây\
    \ dựng công trình, giá vật liệu xây dựng, giá nhân công, giá\nmáy và thiết bị\
    \ thi công của chuyên ngành gửi Bộ Xây dựng để cập nhật vào hệ thống\ncơ sở dữ\
    \ liệu.\n\n3. Ủy ban nhân dân cấp tỉnh có\ntrách nhiệm tổng hợp, cung cấp các\
    \ định mức dự toán đối với các công tác xây dựng\nđặc thù của địa phương; giá\
    \ xây dựng công trình, giá vật liệu xây dựng, giá\nnhân công, giá máy và thiết\
    \ bị thi công, chỉ số giá xây dựng trên địa bàn gửi Bộ\nXây dựng để cập nhật vào\
    \ hệ thống cơ sở dữ liệu.\n\n4. Người quyết định đầu tư các dự án sử dụng vốn\
    \ đầu\ntư công, vốn nhà nước ngoài đầu tư công có trách nhiệm chỉ đạo chủ đầu\
    \ tư gửi Bộ\nXây dựng các thông tin, dữ liệu liên quan đến chi phí đầu tư xây\
    \ dựng các dự án\nthuộc phạm vi quản lý để cập nhật vào hệ thống cơ sở dữ liệu.\n\
    \n5. Kinh phí cho việc xây dựng, quản lý, vận hành hệ\nthống cơ sở dữ liệu và\
    \ thu thập, tổng hợp, xử lý, cập nhật thông tin được bố\ntrí từ nguồn ngân sách\
    \ hàng năm và các nguồn kinh phí huy động hợp pháp khác.\n\nChương V\n\nCHI PHÍ\
    \ QUẢN LÝ DỰ ÁN VÀ\nTƯ VẤN ĐẦU TƯ XÂY DỰNG\n\nĐiều 30. Chi phí quản lý dự án\n\
    \n1. Chi phí quản lý dự án được sử dụng để tổ chức quản\nlý việc thực hiện và\
    \ thực hiện các công việc sau:\n\na) Tổ chức quản lý việc thực hiện các công việc:\n\
    giám sát công tác khảo sát xây dựng; tuyển chọn thiết kế kiến trúc công trình\n\
    hoặc lựa chọn phương án thiết kế kiến trúc công trình; công tác bồi thường, hỗ\n\
    trợ và tái định cư thuộc trách nhiệm của chủ đầu tư; lập, thẩm tra Báo cáo\nnghiên\
    \ cứu khả thi đầu tư xây dựng hoặc Báo cáo kinh tế - kỹ thuật đầu tư xây dựng;\n\
    lập, thẩm tra thiết kế xây dựng triển khai sau thiết kế cơ sở và dự toán xây dựng;\n\
    lựa chọn nhà thầu trong hoạt động xây dựng; quản lý chất lượng, khối lượng, tiến\n\
    độ, chi phí xây dựng, hợp đồng xây dựng; quản lý hệ thống thông tin công trình;\n\
    thu thập và cung cấp thông tin dữ liệu phục vụ công tác quản lý chi phí đầu tư\n\
    xây dựng theo yêu cầu của cơ quan nhà nước có thẩm quyền; đảm bảo an toàn lao\
    \ động\nvà vệ sinh môi trường của công trình; xác định định mức dự toán mới, điều\
    \ chỉnh\nđịnh mức dự toán cho công trình; xác định giá xây dựng công trình, chỉ\
    \ số giá\nxây dựng công trình; kiểm tra chất lượng vật liệu, cấu kiện, sản phẩm\
    \ xây dựng,\nthiết bị lắp đặt vào công trình; kiểm định chất lượng bộ phận công\
    \ trình, hạng\nmục công trình, toàn bộ công trình và thí nghiệm chuyên ngành xây\
    \ dựng theo yêu\ncầu; kiểm soát chi phí đầu tư xây dựng; lập báo cáo đánh giá\
    \ tác động môi trường\nsơ bộ, báo cáo đánh giá tác động môi trường, quan trắc\
    \ và giám sát môi trường\ntrong quá trình thi công xây dựng theo quy định của\
    \ pháp luật về bảo vệ môi trường;\nquy đổi vốn đầu tư xây dựng công trình sau\
    \ khi hoàn thành được nghiệm thu, bàn\ngiao đưa vào sử dụng; nghiệm thu, thanh\
    \ toán, quyết toán hợp đồng; thanh toán,\nquyết toán vốn đầu tư xây dựng công\
    \ trình; giám sát, đánh giá đầu tư; nghiệm\nthu, bàn giao công trình; khởi công,\
    \ khánh thành (nếu có), tuyên truyền quảng\ncáo và tổ chức quản lý việc thực hiện\
    \ các công việc cần thiết khác để phục vụ\ncho công tác quản lý dự án;\n\nb) Thực\
    \ hiện các công việc:\ngiám sát, đánh giá đầu tư; thẩm định thiết kế xây dựng\
    \ triển khai sau thiết kế\ncơ sở và thẩm định dự toán xây dựng; xác định dự toán\
    \ gói thầu xây dựng (trong\ntrường hợp đã có dự toán xây dựng công trình được\
    \ phê duyệt) và thực hiện các\ncông việc cần thiết khác thuộc trách nhiệm của\
    \ chủ đầu tư.\n\n2. Nội dung chi phí quản lý dự\nán gồm tiền lương của cán bộ\
    \ quản lý dự án; tiền công trả cho người lao động\ntheo hợp đồng; các khoản phụ\
    \ cấp lương; tiền thưởng; phúc lợi tập thể; các khoản\nđóng góp (bảo hiểm xã hội;\
    \ bảo hiểm y tế; bảo hiểm thất nghiệp; kinh phí công\nđoàn, trích nộp khác theo\
    \ quy định của pháp luật đối với cá nhân được hưởng\nlương từ dự án); ứng dụng\
    \ khoa học công nghệ, đào tạo nâng cao năng lực cán bộ\nquản lý dự án; thanh toán\
    \ các dịch vụ công cộng; vật tư văn phòng phẩm; thông\ntin, tuyên truyền, liên\
    \ lạc; tổ chức hội nghị có liên quan đến dự án; công tác\nphí; thuê mướn, sửa\
    \ chữa, mua sắm tài sản phục vụ quản lý dự án; chi phí khác\nvà chi phí dự phòng.\n\
    \n3. Chi phí quản lý dự án là chi phí tối đa để quản\nlý dự án phù hợp với thời\
    \ gian, phạm vi công việc đã được phê duyệt của dự án,\nđược xác định trên cơ\
    \ sở định mức tỷ lệ phần trăm (%) hoặc bằng cách lập dự\ntoán phù hợp với hình\
    \ thức tổ chức quản lý dự án, thời gian thực hiện dự án,\nquy mô và đặc điểm công\
    \ việc quản lý dự án. Chi phí quản lý dự án được quản lý\ntrên cơ sở dự toán được\
    \ xác định hàng năm phù hợp với nhiệm vụ, công việc quản\nlý dự án thực hiện và\
    \ các chế độ chính sách có liên quan. Chi phí quản lý dự án\nchỉ được điều chỉnh\
    \ khi thay đổi về phạm vi công việc quản lý dự án, tiến độ thực\nhiện dự án, điều\
    \ chỉnh dự án.\n\n4. Trường hợp thuê tư vấn quản lý dự án thì chi phí\ntư vấn\
    \ quản lý dự án được xác định bằng cách lập dự toán trên cơ sở nội dung,\nkhối\
    \ lượng công việc quản lý dự án được chủ đầu tư và tổ chức tư vấn thỏa thuận\n\
    trong hợp đồng tư vấn quản lý dự án.\n\n5. Trường hợp tổng thầu thực hiện hình\
    \ thức hợp đồng\nEPC thực hiện một số công việc quản lý dự án thuộc trách nhiệm\
    \ của chủ đầu tư\nthì tổng thầu được hưởng một phần chi phí quản lý dự án phù\
    \ hợp với phạm vi, khối\nlượng công việc quản lý dự án do chủ đầu tư giao và được\
    \ thỏa thuận trong hợp đồng\ntổng thầu.\n\n6. Tổng chi phí quản lý dự án phần\
    \ công việc do chủ\nđầu tư thực hiện và chi phí quản lý dự án do tư vấn quản lý\
    \ dự án, tổng thầu thực\nhiện theo quy định tại khoản 4, 5 Điều này không vượt\
    \ quá chi phí quản lý dự án\nđã được xác định, phê duyệt theo quy định.\n\nĐiều\
    \ 31. Chi phí tư vấn đầu tư\nxây dựng\n\n1. Các công việc tư vấn đầu tư xây dựng\
    \ gồm:\n\na) Lập nhiệm vụ, lập phương án kỹ thuật khảo sát\nxây dựng, lập nhiệm\
    \ vụ thiết kế; thực hiện khảo sát xây dựng, giám sát khảo sát\nxây dựng; lập Báo\
    \ cáo nghiên cứu tiền khả thi đầu tư xây dựng (nếu có), Báo cáo\nđề xuất chủ trương\
    \ đầu tư (nếu có), Báo cáo nghiên cứu khả thi đầu tư xây dựng\nhoặc Báo cáo kinh\
    \ tế - kỹ thuật đầu tư xây dựng;\n\nb) Thẩm tra Báo cáo nghiên cứu tiền khả thi\
    \ đầu tư\nxây dựng (nếu có), Báo cáo nghiên cứu khả thi đầu tư xây dựng hoặc Báo\
    \ cáo kinh\ntế - kỹ thuật đầu tư xây dựng; thẩm tra thiết kế công nghệ của dự\
    \ án (nếu có);\nthẩm tra phương án bồi thường, hỗ trợ, tái định cư; thi tuyển\
    \ phương án kiến\ntrúc; thiết kế xây dựng công trình; thẩm tra thiết kế xây dựng\
    \ công trình, dự\ntoán xây dựng;\n\nc) Lập, thẩm định hồ sơ mời quan tâm, hồ sơ\
    \ mời sơ\ntuyển, hồ sơ mời thầu, hồ sơ yêu cầu và đánh giá hồ sơ quan tâm, hồ\
    \ sơ dự sơ\ntuyển, hồ sơ dự thầu, hồ sơ đề xuất để lựa chọn nhà thầu trong hoạt\
    \ động xây dựng;\nthẩm định kết quả lựa chọn nhà thầu trong hoạt động xây dựng;\
    \ giám sát thi công\nxây dựng, giám sát lắp đặt thiết bị;\n\nd) Lập, thẩm tra\
    \ định mức xây dựng, giá xây dựng\ncông trình, chỉ số giá xây dựng công trình;\
    \ thẩm tra an toàn giao thông; áp dụng\nmô hình thông tin công trình (BIM);\n\n\
    đ) Tư vấn quản lý dự án (trong trường hợp thuê tư vấn);\nthí nghiệm chuyên ngành\
    \ xây dựng; kiểm tra chất lượng vật liệu, cấu kiện, sản\nphẩm xây dựng, thiết\
    \ bị lắp đặt vào công trình theo yêu cầu của chủ đầu tư (nếu\ncó); kiểm định chất\
    \ lượng bộ phận công trình, hạng mục công trình, toàn bộ công\ntrình (nếu có);\
    \ giám sát, đánh giá dự án đầu tư xây dựng công trình (trong trường\nhợp thuê\
    \ tư vấn);\n\ne) Lập báo cáo đánh giá tác động môi trường sơ bộ,\nbáo cáo đánh\
    \ giá tác động môi trường, quan trắc và giám sát môi trường trong\nquá trình thi\
    \ công xây dựng theo quy định của pháp luật về bảo vệ môi trường;\n\ng) Thực hiện\
    \ việc quy đổi vốn\nđầu tư xây dựng công trình sau khi hoàn thành được nghiệm\
    \ thu, bàn giao đưa vào\nsử dụng (nếu có);\n\nh) Các công việc tư vấn khác có\
    \ liên quan.\n\n2. Nội dung chi phí công việc\ntư vấn đầu tư xây dựng gồm chi\
    \ phí nhân công tư vấn (tiền lương, các khoản phụ\ncấp lương, tiền thưởng, phúc\
    \ lợi tập thể, các khoản đóng góp bảo hiểm xã hội, bảo\nhiểm y tế, bảo hiểm thất\
    \ nghiệp, kinh phí công đoàn, trích nộp khác theo quy định\ncủa pháp luật đối\
    \ với các cá nhân thực hiện công việc tư vấn tại dự án); chi\nphí ứng dụng khoa\
    \ học công nghệ, quản lý hệ thống thông tin công trình; chi phí\nthanh toán các\
    \ dịch vụ công cộng, vật tư văn phòng phẩm, thông tin, liên lạc;\nchi phí thuê\
    \ mướn, sửa chữa, mua sắm tài sản phục vụ tư vấn cho dự án (nếu có);\nchi phí\
    \ quản lý của tổ chức tư vấn; chi phí khác; thu nhập chịu thuế tính trước;\nthuế\
    \ giá trị gia tăng và chi phí dự phòng. Riêng chi phí khảo sát xây dựng, thí\n\
    nghiệm chuyên ngành xây dựng gồm các khoản mục chi phí quy định tại khoản 2 Điều\
    \ 12 Nghị định này và các\nchi phí khác có liên quan (nếu có).\n\n3. Chi phí tư\
    \ vấn đầu tư xây dựng\nđược xác định bằng định mức tỷ lệ phần trăm (%) do Bộ Xây\
    \ dựng ban hành hoặc bằng\ncách lập dự toán trên cơ sở phạm vi công việc tư vấn,\
    \ khối lượng công việc phải\nthực hiện, kế hoạch thực hiện của gói thầu và các\
    \ quy định về chế độ, chính\nsách do nhà nước ban hành.\n\n4. Chi phí tư vấn đầu\
    \ tư xây dựng đã phê duyệt là\nchi phí tối đa để thực hiện công tác tư vấn đầu\
    \ tư xây dựng và chỉ được điều chỉnh\nkhi thay đổi về phạm vi công việc, điều\
    \ kiện và tiến độ thực hiện công tác tư vấn\nđầu tư xây dựng. Chi phí tư vấn đầu\
    \ tư xây dựng được quản lý thông qua hợp đồng\ntư vấn xây dựng.\n\n5. Trường hợp\
    \ chủ đầu tư, các Ban quản lý dự án đầu\ntư xây dựng có đủ điều kiện năng lực\
    \ theo quy định thực hiện một số công việc\ntư vấn đầu tư xây dựng thì được bổ\
    \ sung chi phí thực hiện các công việc này vào\nchi phí quản lý dự án.\n\n6. Chi\
    \ phí thuê tư vấn nước ngoài thực hiện một số\nloại công việc tư vấn thực hiện\
    \ theo quy định tại Điều 32 Nghị\nđịnh này.\n\nĐiều 32. Chi phí thuê tư vấn\n\
    nước ngoài\n\n1. Người quyết định đầu tư quyết định việc thuê tư\nvấn nước ngoài\
    \ theo quy định của pháp luật về đấu thầu.\n\n2. Chi phí thuê tư vấn nước ngoài\
    \ được xác định phù\nhợp với loại công việc tư vấn trên cơ sở số lượng chuyên\
    \ gia, trình độ chuyên\ngia tư vấn, thời gian làm việc của chuyên gia, mức tiền\
    \ lương của chuyên gia của\nquốc gia và khu vực dự kiến thuê và các chi phí cần\
    \ thiết khác để hoàn thành\ncông việc tư vấn.\n\n3. Chi phí thuê tư vấn nước ngoài\
    \ xác định theo dự\ntoán hoặc cơ sở dữ liệu chi phí thuê tư vấn nước ngoài của\
    \ các công trình, dự án\ntương tự tại Việt Nam. Dự toán chi phí thuê tư vấn nước\
    \ ngoài là toàn bộ chi\nphí cần thiết dự kiến để hoàn thành dịch vụ tư vấn xây\
    \ dựng được thuê, gồm: chi\nphí chuyên gia, chi phí quản lý, các khoản chi phí\
    \ khác có liên quan, thu nhập\nchịu thuế tính trước, chi phí dự phòng và các khoản\
    \ thuế phải nộp theo quy định\ncủa pháp luật.\n\n4. Dự toán chi phí thuê tư vấn\n\
    nước ngoài do cơ quan chuyên môn trực thuộc người quyết định đầu tư thẩm định\n\
    trình người quyết định đầu tư phê duyệt. Trường hợp dự án do Thủ tướng Chính phủ\n\
    quyết định đầu tư, giao cơ quan quản lý cấp trên của chủ đầu tư tổ chức thẩm định,\n\
    phê duyệt.\n\n5. Phương pháp xác định chi phí thuê tư vấn nước\nngoài thực hiện\
    \ theo quy định của Bộ trưởng Bộ Xây dựng.\n\nChương VI\n\nTHANH TOÁN, QUYẾT TOÁN\
    \ HỢP\nĐỒNG XÂY DỰNG VÀ THANH TOÁN, QUYẾT TOÁN VỐN ĐẦU TƯ XÂY DỰNG\n\nĐiều 33.\
    \ Thanh toán, quyết\ntoán hợp đồng xây dựng\n\nViệc thanh toán, quyết toán hợp\
    \ đồng xây dựng thực\nhiện theo các quy định tại Nghị định quy định chi tiết về\
    \ hợp đồng xây dựng.\n\nĐiều 34. Thanh toán vốn đầu tư\nxây dựng\n\n1. Việc thanh\
    \ toán, thời hạn thanh toán vốn đầu tư\nxây dựng:\n\na) Dự án sử dụng vốn đầu\
    \ tư công thực hiện theo quy\nđịnh của pháp luật về đầu tư công;\n\nb) Dự án sử\
    \ dụng vốn nhà nước ngoài đầu tư công, dự\nán PPP thực hiện theo quy định của\
    \ pháp luật có liên quan.\n\n2. Chủ đầu tư hoặc đại diện hợp pháp của chủ đầu\
    \ tư\nchịu trách nhiệm về giá trị đề nghị thanh toán trong hồ sơ đề nghị thanh\
    \ toán\ntheo quy định; cơ quan thanh toán vốn đầu tư không chịu trách nhiệm về\
    \ tính\nchính xác của giá trị đề nghị thanh toán trong hồ sơ đề nghị thanh toán\
    \ của chủ\nđầu tư hoặc đại diện hợp pháp của chủ đầu tư. Trong quá trình thanh\
    \ toán, trường\nhợp phát hiện những sai sót trong hồ sơ đề nghị thanh toán, cơ\
    \ quan thanh toán\nvốn đầu tư thông báo bằng văn bản để chủ đầu tư hoặc đại diện\
    \ hợp pháp của chủ\nđầu tư bổ sung, hoàn chỉnh hồ sơ.\n\n3. Nghiêm cấm cơ quan\
    \ thanh toán vốn đầu tư và chủ\nđầu tư tự đặt ra các quy định trái pháp luật trong\
    \ việc thanh toán vốn đầu tư\nxây dựng.\n\nĐiều 35. Quyết toán vốn đầu tư\nxây\
    \ dựng\n\n1. Dự án đầu tư xây dựng phải thực hiện quyết toán\nvốn đầu tư xây dựng\
    \ sau khi hoàn thành bàn giao đưa vào sử dụng hoặc dừng thực\nhiện vĩnh viễn khi\
    \ cấp có thẩm quyền có văn bản dừng hoặc cho phép chấm dứt thực\nhiện dự án.\n\
    \n2. Vốn đầu tư được quyết toán phải nằm trong giới hạn\ntổng mức đầu tư xây dựng\
    \ được phê duyệt hoặc được điều chỉnh theo quy định của\npháp luật.\n\n3. Vốn\
    \ đầu tư được quyết toán là toàn bộ chi phí hợp\npháp thực hiện trong quá trình\
    \ đầu tư xây dựng để đưa công trình, của dự án vào\nkhai thác, sử dụng. Chi phí\
    \ hợp pháp là toàn bộ các khoản chi phí thực hiện\ntrong phạm vi dự án, thiết\
    \ kế, dự toán được phê duyệt; hợp đồng xây dựng đã ký\nkết theo quy định của pháp\
    \ luật kể cả phần điều chỉnh, bổ sung được phê duyệt.\nRiêng dự án PPP thực hiện\
    \ theo quy định của pháp luật về đầu tư theo hình thức\nđối tác công tư.\n\n4.\
    \ Nhà thầu có trách nhiệm lập hồ sơ quyết toán hợp\nđồng đã ký kết với chủ đầu\
    \ tư theo quy định của pháp luật về hợp đồng xây dựng\nlàm cơ sở quyết toán vốn\
    \ đầu tư.\n\n5. Chủ đầu tư có trách nhiệm\nthực hiện quyết toán vốn đầu tư xây\
    \ dựng trong phạm vi tổng mức đầu tư của dự\nán được phê duyệt; lập Hồ sơ quyết\
    \ toán vốn đầu tư xây dựng và quy đổi vốn đầu\ntư xây dựng để trình người quyết\
    \ định đầu tư phê duyệt chậm nhất là 09 tháng kể\ntừ ngày công trình được ký biên\
    \ bản nghiệm thu hoàn thành, bàn giao đưa công\ntrình vào khai thác, sử dụng.\
    \ Đối với hạng mục công trình độc lập hoặc công\ntrình thuộc dự án có nhiều công\
    \ trình được hoàn thành, bàn giao đưa vào khai\nthác, sử dụng, trường hợp cần\
    \ thiết phải quyết toán ngay thì chủ đầu tư báo cáo\nngười quyết định đầu tư xem\
    \ xét, quyết định.\n\n6. Cơ quan thẩm tra, phê duyệt quyết toán có trách\nnhiệm\
    \ thực hiện thẩm tra, phê duyệt quyết toán chậm nhất là 09 tháng kể từ ngày\n\
    nhận đủ hồ sơ quyết toán theo quy định.\n\n7. Chủ đầu tư có trách nhiệm giải quyết\
    \ công nợ, tất\ntoán tài khoản dự án tại cơ quan thanh toán vốn đầu tư trong vòng\
    \ 06 tháng kể từ\nkhi có quyết định phê duyệt quyết toán vốn đầu tư dự án hoàn\
    \ thành. Trường hợp\ndự án hoàn thành đã được phê duyệt quyết toán chưa được bố\
    \ trí đủ vốn, chủ đầu\ntư có trách nhiệm báo cáo Người quyết định đầu tư và các\
    \ cơ quan liên quan bố\ntrí vốn để giải quyết công nợ, tất toán tài khoản dự án\
    \ theo quy định.\n\n8. Đối với các dự án đầu tư xây dựng sử dụng vốn đầu\ntư công,\
    \ sau khi kết thúc niên độ ngân sách, chủ đầu tư thực hiện việc quyết\ntoán, sử\
    \ dụng vốn đầu tư theo niên độ theo quy định của Bộ Tài chính.\n\n9. Chủ đầu tư\
    \ chậm thực hiện quyết toán theo quy định\ntại khoản 5 Điều này bị xử lý theo\
    \ quy định của pháp luật về xử phạt vi phạm\nhành chính trong hoạt động đầu tư\
    \ xây dựng.\n\n10. Thẩm quyền phê duyệt quyết toán vốn đầu tư:\n\na) Đối với các\
    \ dự án quan trọng quốc gia và các dự\nán quan trọng khác do Thủ tướng Chính phủ\
    \ quyết định đầu tư, giao cơ quan quản\nlý cấp trên của chủ đầu tư phê duyệt quyết\
    \ toán các dự án thành phần sử dụng vốn\nđầu tư công và các dự án thành phần sử\
    \ dụng vốn nhà nước ngoài đầu tư công;\n\nb) Đối với các dự án còn lại, người\
    \ quyết định đầu\ntư là người có thẩm quyền phê duyệt quyết toán vốn đầu tư hoặc\
    \ ủy quyền phê duyệt\nquyết toán vốn đầu tư dự án hoàn thành;\n\nc) Đối với dự\
    \ án PPP thực hiện theo quy định của\npháp luật về đầu tư theo hình thức đối tác\
    \ công tư.\n\nChương VII\n\nQUYỀN, NGHĨA VỤ VÀ TRÁCH\nNHIỆM CỦA NGƯỜI QUYẾT ĐỊNH\
    \ ĐẦU TƯ, CHỦ ĐẦU TƯ, NHÀ THẦU XÂY DỰNG TRONG QUẢN LÝ CHI\nPHÍ ĐẦU TƯ XÂY DỰNG\n\
    \nĐiều 36. Quyền và trách nhiệm\ncủa người quyết định đầu tư\n\n1. Thực hiện quy\
    \ định về quyền và trách nhiệm của\nngười quyết định đầu tư tại Điều 72 Luật Xây\
    \ dựng và khoản 22 Điều 1 Luật sửa đổi, bổ sung một số điều của Luật Xây dựng\n\
    và thẩm quyền quy định tại Nghị định này và pháp luật khác có liên quan.\n\n2.\
    \ Quyết định giá gói thầu trong kế hoạch lựa chọn\nnhà thầu, loại hợp đồng, hình\
    \ thức hợp đồng.\n\nĐiều 37. Quyền và nghĩa vụ của\nchủ đầu tư\n\n1. Thực hiện\
    \ quy định về quyền và nghĩa vụ của chủ\nđầu tư tại Điều 68 Luật Xây dựng và thẩm\
    \ quyền quy định tại\nNghị định này và pháp luật khác có liên quan.\n\n2. Chấp\
    \ thuận các đề xuất về\nthay đổi vật tư, vật liệu xây dựng, biện pháp thi công,\
    \ yêu cầu kỹ thuật theo đề\nxuất của tư vấn thiết kế hoặc nhà thầu thi công xây\
    \ dựng nhưng phải đảm bảo các\nyêu cầu về mặt kỹ thuật, mỹ thuật, chất lượng,\
    \ tiến độ, an toàn, bảo vệ môi trường\ntheo các thỏa thuận của hợp đồng xây dựng\
    \ đã ký kết phù hợp với quy định của\npháp luật về hợp đồng xây dựng và mục tiêu\
    \ của dự án.\n\n3. Quản lý chặt chẽ, sử dụng nguồn vốn bố trí cho dự\nán đúng\
    \ mục đích; kiểm soát chi phí đầu tư xây dựng không vượt tổng mức đầu tư\nxây\
    \ dựng theo quy định, đảm bảo tiến độ, hiệu quả của dự án.\n\n4. Thực hiện một\
    \ số công việc tư vấn đầu tư xây dựng\nnếu có đủ điều kiện năng lực theo quy định.\n\
    \n5. Cung cấp thông tin dữ liệu của dự án theo yêu cầu\ncủa cơ quan quản lý nhà\
    \ nước; phối hợp hoặc tổ chức thu thập thông tin quản lý\nchi phí theo yêu cầu\
    \ của cơ quan quản lý nhà nước.\n\n6. Tạm ứng, thanh toán và quyết toán hợp đồng\
    \ theo\ncác quy định trong hợp đồng đã ký kết với nhà thầu.\n\n7. Mua bảo hiểm\
    \ công trình đối với các công trình\ncó quy định phải mua bảo hiểm hoặc ủy quyền\
    \ cho nhà thầu mua bảo hiểm thông qua\nhợp đồng xây dựng.\n\n8. Thực hiện nộp\
    \ phạt khi bị xử\nphạt vi phạm hành chính trong hoạt động đầu tư xây dựng từ nguồn\
    \ chi phí quản\nlý dự án.\n\nĐiều 38. Quyền và nghĩa vụ của\nnhà thầu tư vấn thực\
    \ hiện công việc về quản lý chi phí đầu tư xây dựng\n\n1. Nhà thầu tư vấn có các\
    \ quyền và nghĩa vụ được\nquy định trong hợp đồng tư vấn thực hiện công việc về\
    \ quản lý chi phí đầu tư\nxây dựng quy định tại Nghị định quy định chi tiết một\
    \ số nội dung về quản lý dự\nán đầu tư xây dựng và các pháp luật khác có liên\
    \ quan.\n\n2. Yêu cầu chủ đầu tư cung cấp thông tin, tài liệu\nliên quan đến nhiệm\
    \ vụ tư vấn được giao.\n\n3. Chịu trách nhiệm về nội dung, chất lượng, tiến độ\n\
    công việc tư vấn do mình thực hiện; cung cấp thông tin dữ liệu quản lý chi phí\n\
    của dự án khi cơ quan quản lý nhà nước và chủ đầu tư yêu cầu.\n\n4. Được bảo hộ\
    \ quyền sở hữu trí tuệ đối với sản phẩm\ntư vấn của mình theo quy định của pháp\
    \ luật.\n\n5. Từ chối thực hiện yêu cầu trái pháp luật của chủ\nđầu tư.\n\n6.\
    \ Bồi thường thiệt hại do không tuân thủ các quy định\ncủa pháp luật về quản lý\
    \ chi phí đầu tư xây dựng và vi phạm hợp đồng làm thiệt\nhại cho chủ đầu tư.\n\
    \nĐiều 39. Quyền và nghĩa vụ của\nnhà thầu thi công xây dựng\n\n1. Nhà thầu thi\
    \ công xây dựng có các quyền và nghĩa\nvụ được quy định trong hợp đồng thi công\
    \ xây dựng và các pháp luật khác có liên\nquan.\n\n2. Quyết định định mức dự toán,\
    \ giá xây dựng công\ntrình và các chi phí khác có liên quan khi xác định giá dự\
    \ thầu để tham gia đấu\nthầu.\n\n3. Được đề xuất, thỏa thuận với chủ đầu tư về\
    \ định\nmức xây dựng, giá xây dựng công trình đối với các công việc phát sinh\
    \ theo quy\nđịnh trong hợp đồng xây dựng, phù hợp với các quy định của pháp luật\
    \ về quản lý\nchi phí đầu tư xây dựng và hợp đồng xây dựng.\n\n4. Phối hợp với\
    \ chủ đầu tư trong việc tổ chức khảo\nsát để xác định các định mức điều chỉnh,\
    \ định mức mới trong quá trình thi công\nxây dựng (nếu có) theo quy định tại điểm\
    \ a khoản 5 Điều 21 Nghị\nđịnh này.\n\n5. Cung cấp thông tin dữ liệu của dự án\
    \ theo yêu cầu\ncủa cơ quan quản lý nhà nước; phối hợp hoặc tổ chức thu thập thông\
    \ tin, dữ liệu\nliên quan đến chi phí đầu tư xây dựng theo yêu cầu của cơ quan\
    \ quản lý nhà nước.\n\n6. Bồi thường thiệt hại do không tuân thủ các quy định\n\
    của pháp luật về quản lý chi phí đầu tư xây dựng và vi phạm hợp đồng làm thiệt\n\
    hại cho chủ đầu tư.\n\nChương VIII\n\nQUẢN LÝ NHÀ NƯỚC VỀ CHI\nPHÍ ĐẦU TƯ XÂY\
    \ DỰNG\n\nĐiều 40. Bộ Xây dựng\n\n1. Chịu trách nhiệm thống nhất quản lý nhà nước\
    \ về\nchi phí đầu tư xây dựng.\n\n2. Hướng dẫn về nội dung,\nphương pháp xác định\
    \ và quản lý, kiểm soát chi phí đầu tư xây dựng công trình,\ngồm: sơ bộ tổng mức\
    \ đầu tư xây dựng, tổng mức đầu tư xây dựng, dự toán xây dựng,\nđịnh mức xây dựng\
    \ và giá xây dựng công trình, suất vốn đầu tư xây dựng, chỉ số\ngiá xây dựng,\
    \ đơn giá nhân công xây dựng, giá ca máy và thiết bị thi công, đo\nbóc khối lượng\
    \ công trình, quy đổi vốn đầu tư xây dựng, chi phí tư vấn đầu tư\nxây dựng.\n\n\
    3. Ban hành định mức xây dựng;\ncông bố suất vốn đầu tư xây dựng, giá xây dựng\
    \ tổng hợp, chỉ số giá xây dựng quốc\ngia, định mức các hao phí và các dữ liệu\
    \ cơ bản để tính giá ca máy. Tổ chức rà\nsoát thường xuyên và tổng hợp kết quả\
    \ rà soát điều chỉnh, bổ sung các định mức\nvà ban hành theo quy định.\n\n4. Chủ\
    \ trì tổ chức xây dựng, hướng dẫn và vận hành\nhệ thống cơ sở dữ liệu về định\
    \ mức xây dựng, giá xây dựng công trình và chỉ số\ngiá xây dựng.\n\n5. Thanh tra,\
    \ kiểm tra việc thực hiện các quy định\nvề quản lý chi phí đầu tư xây dựng.\n\n\
    Điều 41. Bộ Kế hoạch và Đầu tư\n\n1. Chủ trì, phối hợp với các đơn vị liên quan\
    \ thẩm\nđịnh nguồn vốn và khả năng bố trí vốn cho các dự án đầu tư xây dựng sử\
    \ dụng vốn\nđầu tư công; tổng hợp trình Chính phủ, Thủ tướng Chính phủ kế hoạch\
    \ đầu tư công\ntrung hạn và hàng năm của quốc gia.\n\n2. Tổ chức thực hiện giám\
    \ sát, đánh giá đầu tư, kiểm\ntra, thanh tra đối với các dự án sử dụng vốn đầu\
    \ tư công theo quy định của pháp\nluật.\n\nĐiều 42. Bộ Tài chính\n\n1. Quy định\
    \ về quản lý, sử dụng\ncác khoản thu từ hoạt động tư vấn, quản lý dự án của các\
    \ chủ đầu tư, ban quản\nlý dự án sử dụng vốn đầu tư công.\n\n2. Thanh tra, kiểm\
    \ tra việc thanh toán, quyết toán\nvốn đầu tư xây dựng công trình, dự án hoàn\
    \ thành.\n\nĐiều 43. Các bộ quản lý công\ntrình xây dựng chuyên ngành và Ủy ban\
    \ nhân dân cấp tỉnh\n\n1. Các bộ quản lý công trình\nxây dựng chuyên ngành\n\n\
    a) Căn cứ phương pháp lập định mức xây dựng do Bộ\nXây dựng hướng dẫn, tổ chức\
    \ xây dựng và ban hành các định mức xây dựng cho các\ncông tác xây dựng đặc thù\
    \ của chuyên ngành;\n\nb) Định kỳ rà soát hệ thống định mức xây dựng do\nmình\
    \ ban hành và gửi những định mức xây dựng mới, định mức điều chỉnh về Bộ Xây\n\
    dựng để theo dõi, quản lý theo quy định.\n\n2. Bộ Quốc phòng quy định về\nphương\
    \ pháp xác định dự toán chi phí rà phá bom mìn, vật nổ sau khi lấy ý kiến\nthống\
    \ nhất của Bộ Xây dựng.\n\n3. Ủy ban nhân dân cấp tỉnh\n\na) Hướng dẫn lập và\
    \ quản lý chi phí đầu tư xây dựng;\nkiểm tra việc thực hiện các quy định về quản\
    \ lý chi phí đầu tư xây dựng trên địa\nbàn;\n\nb) Căn cứ phương pháp lập định\
    \ mức xây dựng do Bộ\nXây dựng hướng dẫn, tổ chức xây dựng và ban hành định mức\
    \ cho các công tác xây\ndựng đặc thù của địa phương;\n\nc) Định kỳ rà soát hệ\
    \ thống định mức xây dựng do\nmình ban hành và gửi những định mức xây dựng mới,\
    \ định mức điều chỉnh về Bộ Xây\ndựng để theo dõi, quản lý theo quy định;\n\n\
    d) Công bố đơn giá xây dựng công trình của địa\nphương; công bố hoặc phân cấp,\
    \ ủy quyền cho Sở Xây dựng công bố chỉ số giá xây\ndựng; phân cấp, ủy quyền cho\
    \ Sở Xây dựng công bố giá vật liệu xây dựng, thiết bị\ncông trình, đơn giá nhân\
    \ công xây dựng, giá ca máy và thiết bị thi công, giá\nthuê máy và thiết bị thi\
    \ công;\n\nđ) Bố trí ngân sách hàng năm cho việc xây dựng, ban\nhành, công bố\
    \ các thông tin, dữ liệu được quy định tại điểm b khoản này.\n\nChương IX\n\n\
    ĐIỀU KHOẢN THI HÀNH\n\nĐiều 44. Quy định chuyển tiếp\n\n1. Đối với các dự án đầu\
    \ tư xây dựng đã trình thẩm\nđịnh trước ngày 01 tháng 01 năm 2021 theo quy định\
    \ của Luật Xây dựng năm 2014 nhưng chưa có thông báo\nkết quả thẩm định tổng mức\
    \ đầu tư xây dựng trước ngày Nghị định này có hiệu lực\nthi hành, việc thẩm định\
    \ được tiếp tục thực hiện theo quy định của Luật Xây dựng năm 2014 và các văn\
    \ bản quy phạm\npháp luật hướng dẫn thi hành; các hoạt động quản lý chi phí đầu\
    \ tư xây dựng tiếp\ntheo thực hiện theo quy định của Nghị định này.\n\n2. Đối\
    \ với các dự án đầu tư xây dựng đã có thông\nbáo kết quả thẩm định tổng mức đầu\
    \ tư xây dựng nhưng chưa phê duyệt trước ngày\nNghị định này có hiệu lực thi hành\
    \ không phải thẩm định lại; các hoạt động quản\nlý chi phí đầu tư xây dựng tiếp\
    \ theo thực hiện theo quy định của Nghị định này\n\n3. Đối với các dự án đầu tư\
    \ xây dựng đã phê duyệt\ntrước ngày Nghị định này có hiệu lực thi hành chưa thực\
    \ hiện công việc nào thuộc\ngiai đoạn thực hiện dự án (đối với trường hợp cần\
    \ lựa chọn nhà thầu là chưa\nphát hành hồ sơ mời thầu, hồ sơ yêu cầu), các hoạt\
    \ động quản lý chi phí đầu tư\nxây dựng tiếp theo thực hiện theo quy định của\
    \ Nghị định này.\n\n4. Đối với các dự án đầu tư\nxây dựng đã phê duyệt trước ngày\
    \ Nghị định này có hiệu lực thi hành đã hoặc\nđang thực hiện một hoặc một số các\
    \ công việc thuộc giai đoạn thực hiện dự án,\nviệc chuyển tiếp về quản lý chi\
    \ phí đầu tư xây dựng đối với các công việc chưa\nthực hiện như sau:\n\na) Nội\
    \ dung thẩm định, thẩm quyền thẩm định, phê\nduyệt chi phí đầu tư xây dựng thực\
    \ hiện theo quy định của Nghị định này và Nghị\nđịnh quy định chi tiết một số\
    \ nội dung về quản lý dự án đầu tư xây dựng;\n\nb) Việc xác định và quản lý chi\
    \ phí đầu tư xây dựng\n(ngoài các nội dung nêu tại điểm a khoản này) tiếp tục\
    \ thực hiện theo quy định\ncủa pháp luật về quản lý chi phí đầu tư xây dựng đang\
    \ áp dụng cho dự án;\n\nc) Việc chuyển tiếp áp dụng, tham khảo định mức xây\n\
    dựng thực hiện theo quy định tại khoản 5 Điều này.\n\n5. Hệ thống định mức xây\
    \ dựng dã được cơ quan có thẩm\nquyền ban hành, công bố tiếp tục được áp dụng,\
    \ tham khảo để xác định chi phí đầu\ntư xây dựng theo các quy định của pháp luật\
    \ về quản lý chi phí đầu tư xây dựng\náp dụng cho dự án cho đến khi hệ thống định\
    \ mức quy định tại điểm\na, b khoản 1 Điều 22 Nghị định này được các cơ quan có\
    \ thẩm quyền ban hành\nvà có hiệu lực.\n\n6. Hệ thống giá xây dựng công trình\
    \ và chỉ số giá\nxây dựng do cơ quan có thẩm quyền công bố trước ngày Nghị định\
    \ này có hiệu lực\nthi hành được tiếp tục tham khảo, sử dụng để xác định chi phí\
    \ đầu tư xây dựng\ncho đến khi hệ thống giá xây dựng công trình và chỉ số giá\
    \ xây dựng được công bố\ntheo quy định tại Điều 26, Điều 27 của Nghị định này.\
    \ Ủy\nban nhân dân cấp tỉnh tổ chức cập nhật, hướng dẫn sử dụng đơn giá xây dựng\
    \ công\ntrình khi hệ thống định mức quy định tại điểm a, b khoản 1 Điều\n22 Nghị\
    \ định này được các cơ quan có thẩm quyền ban hành.\n\n7. Các phương pháp xác\
    \ định chi phí đầu tư xây dựng\nđược ban hành trước thời điểm Nghị định này có\
    \ hiệu lực thi hành được tiếp tục\nsử dụng để xác định chi phí đầu tư xây dựng\
    \ đối với các dự án đang thực hiện\ncác công việc chuẩn bị dự án và các dự án\
    \ quy định tại khoản 1, 2, 3 Điều này\ncho đến khi các phương pháp nêu tại khoản\
    \ 2 Điều 40 Nghị định\nnày có hiệu lực thi hành.\n\n8. Việc cập nhật chi phí đầu\n\
    tư xây dựng theo hệ thống định mức xây dựng, giá xây dựng, các phương pháp xác\n\
    định chi phí đầu tư xây dựng sau khi cơ quan có thẩm quyền ban hành, công bố và\n\
    có hiệu lực theo quy định tại Nghị định này được thực hiện như sau:\n\na) Tổng\
    \ mức đầu tư xây dựng đã thẩm định hoặc phê\nduyệt thì không phải thẩm định hoặc\
    \ phê duyệt lại. Chủ đầu tư tổ chức xác định\ndự toán xây dựng theo hệ thống định\
    \ mức xây dựng, giá xây dựng, các phương pháp\nxác định chi phí đầu tư xây dựng\
    \ được ban hành, công bố theo quy định;\n\nb) Dự toán xây dựng đã thẩm định hoặc\
    \ phê duyệt thì\nkhông phải thẩm định hoặc phê duyệt lại;\n\nc) Các gói thầu chưa\
    \ phát hành hồ sơ mời thầu, hồ\nsơ yêu cầu trước ngày hệ thống định mức xây dựng,\
    \ giá xây dựng, các phương pháp\nxác định chi phí đầu tư xây dựng được ban hành,\
    \ công bố và có hiệu lực: chủ đầu\ntư tự thực hiện việc cập nhật dự toán gói thầu\
    \ để xác định lại giá gói thầu\ntrong kế hoạch lựa chọn nhà thầu đã được phê duyệt,\
    \ làm cơ sở lựa chọn nhà thầu\ntheo quy định của pháp luật về đấu thầu;\n\nd)\
    \ Các gói thầu đã phát hành hồ sơ mời thầu, hồ sơ\nyêu cầu nhưng chưa đóng thầu\
    \ thì chủ đầu tư xem xét, quyết định việc cập nhật dự\ntoán gói thầu để xác định\
    \ lại giá gói thầu làm cơ sở lựa chọn nhà thầu theo quy\nđịnh của pháp Luật về\
    \ đấu thầu. Trường hợp đã đóng thầu, thực hiện theo nội\ndung hồ sơ mời thầu,\
    \ hồ sơ yêu cầu, hồ sơ dự thầu, hồ sơ đề xuất; không phải cập\nnhật lại giá gói\
    \ thầu;\n\nđ) Trường hợp cần thiết, người quyết định đầu tư,\nchủ đầu tư quyết\
    \ định việc cập nhật, thẩm định, phê duyệt lại tổng mức đầu tư\nxây dựng tại điểm\
    \ a khoản này; dự toán xây dựng tại điểm b khoản này theo thẩm\nquyền;\n\ne) Trường\
    \ hợp cập nhật, xác định lại tổng mức đầu\ntư xây dựng, dự toán xây dựng, giá\
    \ gói thầu xây dựng quy định tại điểm c, d, đ\nkhoản này làm vượt tổng mức đầu\
    \ tư xây dựng, dự toán xây dựng đã phê duyệt, thì\nviệc thẩm định, phê duyệt tổng\
    \ mức đầu tư xây dựng điều chỉnh, dự toán xây dựng\nđiều chỉnh thực hiện theo\
    \ quy định.\n\nĐiều 45. Tổ chức thực hiện\n\n1. Các Bộ trưởng, Thủ trưởng cơ quan\
    \ ngang bộ, Thủ\ntrưởng cơ quan thuộc Chính phủ, Chủ tịch Ủy ban nhân dân các\
    \ tỉnh, thành phố trực\nthuộc trung ương, Thủ trưởng các tổ chức chính trị, chính\
    \ trị - xã hội, tổ chức\nchính trị - xã hội nghề nghiệp và các tổ chức, cá nhân\
    \ có liên quan chịu trách\nnhiệm thi hành Nghị định này.\n\n2. Bộ Xây dựng chủ\
    \ trì, phối hợp với các bộ, ngành\nliên quan chịu trách nhiệm hướng dẫn thực hiện\
    \ Nghị định này.\n\nĐiều 46. Hiệu lực thi hành\n\nNghị định này có hiệu lực thi\
    \ hành kể từ ngày ký và\nthay thế Nghị định số 68/2019/NĐ-CP ngày 14 tháng 8 năm\
    \ 2019 của Chính phủ về\nquản lý chi phí đầu tư xây dựng.\n\n \n\n\n\n<table border=\"\
    0\" cellspacing=\"0\" cellpadding=\"0\"><!--VABWAFAATABfADIAMAAyADYAMAA1ADIAOQA=-->\n\
    \ <tbody><tr>\n  <td width=\"321\" valign=\"top\" style=\"width:240.4pt;padding:0cm\
    \ 5.4pt 0cm 5.4pt\">\n  <p style=\"margin-top:6.0pt\"><b><i><br>\n  Nơi nhận:<br>\n\
    \  </i></b><span style=\"font-size:8.0pt\">- Ban Bí thư Trung ương Đảng;<br>\n\
    \  - Thủ tướng, các Phó Thủ tướng Chính phủ;<br>\n  - Các bộ, cơ quan ngang bộ,\
    \ cơ quan thuộc Chính phủ;<br>\n  - HĐND, UBND các tỉnh, thành phố trực thuộc\
    \ trung ương;<br>\n  - Văn phòng Trung ương và các Ban của Đảng;<br>\n  - Văn\
    \ phòng Tổng Bí thư;<br>\n  - Văn phòng Chủ tịch nước;<br>\n  - Hội đồng Dân tộc\
    \ và các Ủy ban của Quốc hội;<br>\n  - Văn phòng Quốc hội;<br>\n  - Tòa án nhân\
    \ dân tối cao;<br>\n  - Viện kiểm sát nhân dân tối cao;<br>\n  - Kiểm toán nhà\
    \ nước;<br>\n  - Ủy ban Giám sát tài chính Quốc gia;<br>\n  - Ngân hàng Chính\
    \ sách xã hội;<br>\n  - Ngân hàng Phát triển Việt Nam;<br>\n  - Ủy ban trung ương\
    \ Mặt trận Tổ quốc Việt Nam;<br>\n  - Cơ quan trung ương của các đoàn thể;<br>\n\
    \  - VPCP: BTCN, các PCN, Trợ lý TTg, TGĐ Cổng TTĐT, các Vụ, Cục, đơn vị trực\n\
    \  thuộc, Công báo;<br>\n  - Lưu: VT, CN (2).</span></p>\n  </td>\n  <td width=\"\
    270\" valign=\"top\" style=\"width:202.4pt;padding:0cm 5.4pt 0cm 5.4pt\">\n  <p\
    \ align=\"center\" style=\"margin-top:6.0pt;text-align:center\"><b>TM. CHÍNH PHỦ<br>\n\
    \  THỦ TƯỚNG<br>\n  <br>\n  <br>\n  <br>\n  <br>\n  Nguyễn Xuân Phúc</b></p>\n\
    \  </td>\n </tr>\n</tbody></table>\n\n\n\n \n\n\n\n\n\n    \n\n              \
