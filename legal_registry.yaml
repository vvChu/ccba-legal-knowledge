    relationship: Guides
  - text: Facebook
    href: http://www.facebook.com/sharer.php
    relationship: Guides
  - text: Thông tư 08/2025/TT-BXD sửa đổi định mức xây dựng tại Thông tư 12/2021/TT-BXD
      do Bộ trưởng Bộ Xây dựng ban hành
    href: https://thuvienphapluat.vn/van-ban/Xay-dung-Do-thi/Thong-tu-08-2025-TT-BXD-sua-doi-dinh-muc-xay-dung-tai-Thong-tu-12-2021-TT-BXD-659350.aspx
    relationship: Amendment
  - text: Thông tư 70/2024/TT-BTC quy định về quản lý, sử dụng các khoản thu từ hoạt
