  - text: Thông tư 09/2024/TT-BXD sửa đổi định mức xây dựng tại Thông tư 12/2021/TT-BXD
      do Bộ trưởng Bộ Xây dựng ban hành
    href: https://thuvienphapluat.vn/van-ban/Xay-dung-Do-thi/Thong-tu-09-2024-TT-BXD-sua-doi-Thong-tu-12-2021-TT-BXD-dinh-muc-xay-dung-623134.aspx
