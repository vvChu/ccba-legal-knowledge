    href: https://thuvienphapluat.vn/van-ban/Xay-dung-Do-thi/Thong-tu-01-2025-TT-BXD-sua-doi-Thong-tu-11-2021-TT-BXD-quan-ly-chi-phi-dau-tu-xay-dung-641705.aspx
    relationship: Amendment
  - text: Nội dung hướng dẫn Điều này tại Thông tư 11/2021/TT-BXD nay được sửa đổi
      bởi Khoản 2 Điều 1 Thông tư 60/2025/TT-BXD có hiệu lực từ ngày 15/02/2026
    href: https://thuvienphapluat.vn/van-ban/Xay-dung-Do-thi/Thong-tu-60-2025-TT-BXD-sua-doi-Thong-tu-11-2021-TT-BXD-12-2021-TT-BXD-13-2021-TT-BXD-687415.aspx
    relationship: Amendment
  - text: Quyết toán vốn đầu tư dự án hoàn thành sử dụng vốn nhà nước ngoài vốn đầu
      tư công được hướng dẫn bởi Thông tư 27/2025/TT-BTC có hiệu lực từ ngày 22/05/2025
