  - text: Nội dung hướng dẫn Điều này tại Thông tư 11/2021/TT-BXD nay được sửa đổi
      bởi Khoản 2 Điều 1 Thông tư 14/2023/TT-BXD có hiệu lực từ ngày 15/02/2024
    href: https://thuvienphapluat.vn/van-ban/Xay-dung-Do-thi/Thong-tu-14-2023-TT-BXD-sua-doi-Thong-tu-11-2021-TT-BXD-quan-ly-chi-phi-dau-tu-xay-dung-595308.aspx
    relationship: Amendment
  - text: Nội dung sửa đổi Điều này tại Thông tư 11/2021/TT-BXD nay được sửa đổi bởi
